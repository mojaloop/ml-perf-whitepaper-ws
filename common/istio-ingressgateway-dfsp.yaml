# DFSP-side Istio IngressGateway overrides (istio_dfsp role). Counterpart to
# common/istio-ingressgateway.yaml (switch side) — separate file because the
# deploy shape differs: single-node MicroK8s clusters (no CORE-API-ADAPTERS
# node-affinity label to select on) on smaller c7i.xlarge/2xlarge/4xlarge
# instances, and no NLB in front (the switch dials each DFSP node's real IP
# directly), so exposure is a NodePort with no matching LB target-group
# config to keep in sync here.
#
# Port 443 exposure: NodePort 30443 (see
# ansible/roles/_common/defaults/main.yml: dfsp_istio_gateway_nodeport —
# keep the literal nodePort below in sync with that value), NOT hostPort.
# DFSP clusters run Calico (not Cilium — the cilium role only
# targets the switch cluster), so hostPort *would* work here unlike on the
# switch, but nginx-ingress already owns hostPort 443 on these single-node
# clusters. Rather than evict it (as the switch role does to its own nginx),
# this gateway claims a distinct NodePort so nginx and Istio coexist on the
# same node without a port conflict. The switch's outbound ServiceEntry
# dials this NodePort directly on the DFSP node IP in place of literal :443.

kind: DaemonSet

service:
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
      nodePort: 30443

# Security: chart defaults are used — the pod-level sysctl
# net.ipv4.ip_unprivileged_port_start=0 already lets the non-root container
# (uid 1337) bind to :443.

# Single-node cluster: this pod shares the node with 4-64 scheme-adapter
# replicas plus sim-backend/cache. Unlike the switch — where an NLB spreads
# inbound traffic across a 20-pod DaemonSet — each DFSP has exactly ONE gateway
# pod, so a single FSP's entire inbound switch traffic lands on it. At 2000 TPS
# a 70%-share payer drives ~3,700 req/s through this one pod (3 callbacks per
# transaction: ALS result, quote result, final notification).
#
# cpu limit drives Envoy's worker count: Istio derives `concurrency` from the
# CPU limit, so a 1-core limit yields `server.concurrency: 1` — a single worker
# thread for all of it, regardless of node size. Measured cost is ~226us of
# gateway CPU per request, so one worker saturates near ~3,700 req/s; at that
# point it sits at ~83% utilization and M/M/1 queueing adds ~4x the service
# time to EVERY request (measured: 107ms mean switch->FSP, against 4ms of
# actual scheme-adapter work). 4 cores gives 4 workers and ~18,000 req/s of
# headroom. This is a limit, not a request, so the smaller fsp203-208 nodes
# only consume what they use (measured 0.15-0.3 cores).
#
# memory: 512Mi peaked at 489Mi (95%) under sustained 2000 TPS load with
# repeated OOMKill restarts — Envoy's per-connection stats grow with connection
# count and churn. 2Gi matches the switch gateway and the switch sidecars,
# where the same 512Mi/1Gi ceiling caused the same failure.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "4"
    memory: 2Gi
