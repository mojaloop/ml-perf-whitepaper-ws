data:
  Corefile: |
    .:53 {
        errors
        health {
          lameduck 5s
        }
        ready
        log . {
          class error
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts {
          10.112.2.214 sim-fsp201.local
          10.112.2.67 sim-fsp202.local
          10.112.2.106 sim-fsp203.local
          10.112.2.105 sim-fsp204.local
          10.112.2.242 sim-fsp205.local
          10.112.2.28 sim-fsp206.local
          10.112.2.143 sim-fsp207.local
          10.112.2.71 sim-fsp208.local
          fallthrough
        }
        prometheus :9153
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
