# Per-scenario DFSP simulator overrides — layered on top of
# common/dfsp/values-fspNNN.yaml by the dfsp role's per_fsp loop.

# scheme-adapter image pin: adds Prometheus latency/event-loop-lag/backend-
# call-duration instrumentation the stock image doesn't expose.

# Sim backend replicas per FSP (single-threaded process, ~1 core each).
# Backend CPU load is driven by the DESTINATION role only (payee-side
# party/quote/transfer lookups) — source-only FSPs measure ~0 backend
# CPU regardless of traffic share, so only the payees are scaled. Every
# backend pod is seeded individually by `make provision`.
dfsp_backend_replicas_default: 1
dfsp_backend_replicas:
  fsp202: 4
  fsp204: 4
  fsp206: 4
  fsp208: 4

# scheme-adapter replicas per FSP. `fspPairs` (overrides/k6.yaml) spreads
# load evenly over four payer->payee pairs, so all eight FSPs carry an equal
# share on identically sized nodes (c7i.4xlarge, 16 vCPU — see aws.yaml).
# A scenario override replaces the role's map rather than merging into it,
# so every FSP is listed.
dfsp_sdk_replicas_default: 24
dfsp_sdk_replicas:
  fsp201: 24
  fsp202: 24
  fsp203: 24
  fsp204: 24
  fsp205: 24
  fsp206: 24
  fsp207: 24
  fsp208: 24

# Redis cache maxmemory. At 200mb the caches evict continuously (allkeys-lru)
# under sustained load rather than as occasional housekeeping, and these nodes
# have 32GB free, so there is room to raise it. Raising it changes SDK cache
# behaviour and therefore what the scenario measures, so it stays at the role
# default until that is measured deliberately.
dfsp_cache_maxmemory: 200mb

# dfsp-prometheus-agent resources. At the role default (512Mi/500m) the
# agent OOMKills at this scenario's per-FSP series volume: remote_write
# can't drain fast enough, so the WAL grows until replaying it on restart
# exceeds the limit again, blacking out that FSP's metrics for the rest of
# the run. Raised for every FSP, since all eight carry an equal share.
dfsp_mon_agent_memory_limit_default: 2Gi
dfsp_mon_agent_cpu_limit_default: "2"

# Circuit-breaker ceilings on the switch's outbound DestinationRule to each FSP
# (ansible/roles/mtls_switch). They bound how many connections and in-flight
# requests Envoy opens per FSP before rejecting with URX/connect-fail, so they
# are ceilings rather than allocations — an unused ceiling costs nothing, while
# too low a one drops traffic under burst. Uniform because every FSP carries an
# equal share of load; the role default (500) leaves little headroom at a 25%
# share.
mtls_sidecar_max_connections_default: 3000
mtls_sidecar_http2_max_requests_default: 3000

# Requests per connection before Envoy recycles it — purely a handshake-
# amortization tradeoff, since the DFSP ingress load-balances every request
# independently and connection reuse does not pin traffic to one pod.
mtls_sidecar_max_requests_per_connection: 100

simulators:
  fsp201:
    config:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4004"
        prometheus.io/path: "/"
      schemeAdapter:
        env:
          ENABLE_TEST_FEATURES: "false"
          LOG_LEVEL: "info"
        image:
          repository: mojaloop/sdk-scheme-adapter
          tag: "v24.20.0"
          pullPolicy: Always
      backend:
        env:
          LOG_LEVEL: "info"
