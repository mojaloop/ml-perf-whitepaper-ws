# Default values for central.
# This is a YAML-formatted file.
# Declare global configurations
global: {}

pdb:
  enabled: true
  maxUnavailable: 1
#  minAvailable: 20%
## Only one key should be set

# Declare variables to be passed into your templates.

account-lookup-service:
  enabled: true

  account-lookup-service:
    enabled: true
    replicaCount: 60
    image:
      tag: v17.16.1
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'
      db_ssl_enabled: true    # DB TLS (encrypt-only; verify off until CA wired)
      db_ssl_verify: false

  account-lookup-service-admin:
    image:
      tag: v17.16.1
  account-lookup-service-handler-timeout:
    image:
      tag: v17.16.1

quoting-service:
  quoting-service:
    enabled: true
    replicaCount: 20
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'
      db_ssl_enabled: true    # DB TLS (encrypt-only; verify off until CA wired)
      db_ssl_verify: false

  quoting-service-handler:
    enabled: true
    replicaCount: 20
    config:
      cache:
        participant_data_expires_in_ms: 60000
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'

# Images: the `-metrics` tags are builds of the upstream services against a
# patched @mojaloop/central-services-stream that adds per-hop Kafka timing
# histograms (moja_kafka_transit / broker_residence / consumer_queue_wait /
# produce_ack). Handler histograms only start once a message is already being
# processed, so the interval between one handler producing and the next starting
# is otherwise unmeasurable and can only be derived as an end-to-end residual.
#
# Applied only to the six-hop transfer path (ml-api-adapter service +
# notification handler; central-ledger prepare, position-batch and fulfil).
# Off-path deployments keep the chart's inherited image — instrumenting them
# would add no measurement and would need matching dist/ command overrides,
# since the chart's default commands target src/ and these images ship dist/.
ml-api-adapter:
  enabled: true
  ml-api-adapter-service:
    enabled: true
    replicaCount: 20
    resources: {}
    image:
      repository: shashi165/ml-api-adapter
      tag: v16.11.1-metrics
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'

  ml-api-adapter-handler-notification:
    enabled: true
    # Matches topic-notification-event's partition count — a consumer group
    # cannot place more consumers on a topic than it has partitions, so any
    # excess replicas idle while still holding connections open.
    replicaCount: 60
    resources: {}
    image:
      repository: shashi165/ml-api-adapter
      tag: v16.11.1-metrics
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'


centralledger:
  enabled: true
  centralledger-service:
    enabled: true
    # Off transfer-hot-path: only backs occasional participant-endpoint
    # lookups from ml-api-adapter-handler-notification/account-lookup-service
    # (~10 req/s measured at 1950 actual TPS, <1% CPU/pod) — not
    # partition/consumer-parallelism bound like the handler deployments.
    replicaCount: 2
    resources: {}
    # This deployment owns the DB schema: its image is what the chart's
    # pre-upgrade centralledger-service-migration hook runs. It must not lag
    # the handlers' image — knex refuses to start when the schema carries
    # migrations the running version does not have.
    # image:
    #   repository: shashi165/central-ledger
    #   tag: v20.2.0-metrics
    # command: '["node", "dist/api/index.js"]'
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'
      db_ssl_enabled: true    # DB TLS (encrypt-only; verify off until CA wired)
      db_ssl_verify: false

  centralledger-handler-transfer-prepare:
    enabled: true
    replicaCount: 20
    resources: {}
    image:
      repository: shashi165/central-ledger
      tag: v20.2.0-metrics
    command: '["node", "dist/handlers/index.js", "handler", "--prepare"]'
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'
      db_ssl_enabled: true    # DB TLS (encrypt-only; verify off until CA wired)
      db_ssl_verify: false

  centralledger-handler-transfer-position-batch:
    enabled: true
    # Position-batch aggregates by participantCurrencyId, not per-transfer —
    # cardinality caps useful parallelism at the number of distinct
    # participant-currency pairs (8, one per FSP), not TPS. More partitions/
    # replicas than that sit permanently idle while still holding a MySQL
    # connection pool open for no throughput benefit.
    replicaCount: 8
    resources: {}
    image:
      repository: shashi165/central-ledger
      tag: v20.2.0-metrics
    command: '["node", "dist/handlers/index.js", "handler", "--positionbatch"]'
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'
      db_ssl_enabled: true    # DB TLS (encrypt-only; verify off until CA wired)
      db_ssl_verify: false

  centralledger-handler-transfer-position:
    enabled: false

  centralledger-handler-transfer-fulfil:
    enabled: true
    replicaCount: 20
    resources: {}
    image:
      repository: shashi165/central-ledger
      tag: v20.2.0-metrics
    command: '["node", "dist/handlers/index.js", "handler", "--fulfil"]'
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'
      db_ssl_enabled: true    # DB TLS (encrypt-only; verify off until CA wired)
      db_ssl_verify: false

  centralledger-handler-timeout:
    enabled: true
    resources: {}
    config:
      # Log config
      log_level: info
      event_log_filter: 'log:info, log:warn, log:error'
      db_ssl_enabled: true    # DB TLS (encrypt-only; verify off until CA wired)
      db_ssl_verify: false

  # DB TLS on off-path CL singletons (helm values; not configmap-patched)
  centralledger-handler-transfer-get:
    config:
      db_ssl_enabled: true
      db_ssl_verify: false
  centralledger-handler-admin-transfer:
    config:
      db_ssl_enabled: true
      db_ssl_verify: false

# DB TLS on central-settlement services (off-path singletons; not configmap-patched)
centralsettlement:
  centralsettlement-service:
    config:
      db_ssl_enabled: true
      db_ssl_verify: false
  centralsettlement-handler-deferredsettlement:
    config:
      db_ssl_enabled: true
      db_ssl_verify: false
  centralsettlement-handler-grosssettlement:
    config:
      db_ssl_enabled: true
      db_ssl_verify: false
  centralsettlement-handler-rules:
    config:
      db_ssl_enabled: true
      db_ssl_verify: false

als-msisdn-oracle:
  enabled: true
  replicaCount: 20
  # DB TLS applied via configmap patch (als-msisdn-oracle-config.json), NOT helm:
  # helm renders db_ssl_verify as a truthy string "false" which breaks the knex
  # migration init container. Keep helm plaintext so `helm --wait` passes.
simulator:
  enabled: false

mojaloop-simulator:
  enabled: false
