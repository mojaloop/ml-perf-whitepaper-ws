# Default values for promfana.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

kps:
  grafana:
    nodeSelector:
      node-role: monitoring
    tolerations:
      - key: dedicated
        operator: Equal
        value: monitoring
        effect: NoSchedule

  prometheus:
    service:
      type: NodePort
      nodePort: 30090
    prometheusSpec:
      enableRemoteWriteReceiver: true # Enable Remote Write Receiver
      nodeSelector:
        node-role: monitoring
      tolerations:
        - key: dedicated
          operator: Equal
          value: monitoring
          effect: NoSchedule

  prometheusOperator:
    nodeSelector:
      node-role: monitoring
    tolerations:
      - key: dedicated
        operator: Equal
        value: monitoring
        effect: NoSchedule

  kube-state-metrics:
    nodeSelector:
      node-role: monitoring
    tolerations:
      - key: dedicated
        operator: Equal
        value: monitoring
        effect: NoSchedule

  # ⚠️ Keep node-exporter as DaemonSet on all nodes
  prometheus-node-exporter:
    nodeSelector: {}
# Kafka broker runs protocol TLS (backend.yaml kafka.listeners.client=SSL);
# the exporter must speak it too or consumer-lag metrics disappear.
# Encrypt-only, matching the clients (no CA verification).
kafka-exporter:
  tls:
    enabled: true
    insecureSkipVerify: true
