# Database values for Mojaloop Performance Testing
# This file configures MySQL and Kafka with proper node placement

## Global settings to allow bitnamilegacy images
global:
  security:
    allowInsecureImages: true

## Reference: https://github.com/bitnamilegacy/charts/blob/main/bitnamilegacy/kafka/values.yaml
kafka:
  enabled: true
  fullnameOverride: "kafka"

  # Kafka protocol TLS (chart auto-generated self-signed certs). Client/
  # external listeners run encrypt-only — external rdkafka clients don't
  # need certs. Controller/interbroker run required mTLS: that traffic is
  # exclusively broker<->broker/controller-quorum, all mutually trusted,
  # with none of the external-client concern the client listener has.
  # Kafka is excluded from the ambient mesh (istio.io/dataplane-mode: none
  # below), so this is the only mTLS this traffic gets. One auto-generated
  # PEM cert covers every SSL-enabled listener per-pod.
  listeners:
    client:
      protocol: SSL
    external:
      protocol: SSL
    controller:
      protocol: SSL
      sslClientAuth: required
    interbroker:
      protocol: SSL
      sslClientAuth: required
  tls:
    type: PEM
    autoGenerated: true
    # Encrypt-only — "required" would demand mTLS from every rdkafka client.
    sslClientAuth: none
    # Required non-empty by the chart's upgrade-passwords check once TLS is
    # enabled; not real credentials — certs are auto-generated per install.
    keystorePassword: "perf-kafka-keystore"
    truststorePassword: "perf-kafka-truststore"

  # controller.overrideConfiguration is a dead key in this chart version
  # (31.5.0) — silently ignored. Every setting that matters, including
  # min.insync.replicas=2, lives in this top-level extraConfig instead.
  extraConfig: |-
    # Topics come only from the provisioning job — auto-creation risks a
    # client racing ahead and creating a 1-partition topic that
    # --if-not-exists then leaves permanently under-provisioned.
    auto.create.topics.enable=false
    offsets.topic.replication.factor=3
    default.replication.factor=3
    transaction.state.log.replication.factor=3
    min.insync.replicas=2
    transaction.state.log.min.isr=2

    delete.topic.enable=true

    num.network.threads=12
    num.io.threads=16
    background.threads=4
    queued.max.requests=2000

    socket.send.buffer.bytes=4194304
    socket.receive.buffer.bytes=4194304

    log.dirs=/bitnami/kafka/data
    # Fewer, larger segments mean less roll/index churn across ~150
    # partitions. TODO: 30min retention is a starting point — production
    # likely wants longer (hours-days).
    log.segment.bytes=536870912
    log.flush.interval.messages=9223372036854775807
    log.flush.interval.ms=9223372036854775807
    log.retention.ms=1800000
    log.retention.check.interval.ms=30000
    log.cleanup.policy=delete
    log.cleaner.enable=true

    # How long a CONSUMER GROUP's committed offset is remembered, separate
    # from message retention above. A group inactive longer than this loses
    # its checkpoint and falls back to auto.offset.reset on rejoin — a
    # correctness gap, so this stays generous at 7 days.
    offsets.retention.minutes=10080

    group.initial.rebalance.delay.ms=0
    compression.type=producer

  # 3 combined controller+broker nodes — required by RF=3 (>=3 distinct
  # brokers) and Raft quorum (odd count for majority fault tolerance).
  controller:
    replicaCount: 3
    # Kafka runs its own protocol TLS (above) — keep it OUT of the ambient
    # mesh so ztunnel doesn't double-encrypt the bulk stream on this node.
    podLabels:
      istio.io/dataplane-mode: none
    # One broker per dedicated kafka-tainted node — without this, nothing
    # stops 2 replicas landing on the same node, defeating RF=3. Chart
    # default (kafka 31.5.0) is "soft"; "hard" is always satisfiable since
    # node count exactly matches replica count.
    podAntiAffinityPreset: hard
    resources:
      # Sized for m7i.2xlarge (8 vCPU/32GiB) — ~3-4 cores/broker sustained
      # (1000TPS + RF=3 fan-out), leaving node headroom.
      requests:
        cpu: "5"
        memory: "12Gi"
        ephemeral-storage: "20Gi"
      limits:
        cpu: "7"
        memory: "24Gi"
        ephemeral-storage: "30Gi"
    # gp3, not io2 — Kafka's append-only sequential I/O fits gp3's bundled
    # throughput. storageClass references the ebs-gp3-encrypted
    # StorageClass created by `make ebs-csi` (ansible/roles/ebs_csi) — must
    # run before `make deploy`/`make backend`, or this PVC will never bind.
    persistence:
      enabled: true
      storageClass: "ebs-gp3-encrypted"
      size: 200Gi

    extraEnvVars:
      # - name: KAFKA_HEAP_OPTS
      #   value: "-Xms6g -Xmx6g"
      - name: KAFKA_JVM_PERFORMANCE_OPTS
        value: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=45 -XX:+ExplicitGCInvokesConcurrent -XX:+ParallelRefProcEnabled -Djava.awt.headless=true"

  provisioning:
    enabled: true
    waitForKafka: true
    persistence:
      enabled: false
    # The provisioning job is itself a Kafka client — point it at the
    # broker cert secret so it trusts the SSL listener. The *SecretKey
    # fields must be blanked — their chart defaults trip the "must not be
    # used without passwordsSecret" validation.
    auth:
      tls:
        type: PEM
        certificatesSecret: kafka-tls
        cert: kafka.crt
        key: kafka.key
        caCert: kafka-ca.crt
        keyPasswordSecretKey: ""
        keystorePasswordSecretKey: ""
        truststorePasswordSecretKey: ""
    # The job's generated client.properties includes a keystore the Java
    # client can't parse (PKCS#1 vs PKCS#8) — topic creation then fails
    # while the job still reports success. The listener is encrypt-only, so
    # no client key is needed: rewrite the config truststore-only first.
    preScript: |
      {
        echo "security.protocol=SSL"
        echo "ssl.truststore.type=PEM"
        awk 'BEGIN{printf "ssl.truststore.certificates="} NR>1{print line" \\"}{line=$0}END{print $0" "}' /certs/kafka-ca.crt
      } > /tmp/client.properties
    # Heavy topics' partition counts match the consumer replica counts in
    # mojaloop.yaml 1:1 — a mismatch leaves extra replicas unable to
    # consume in parallel. Off-path/low-volume topics keep 1 partition.
    # All replicationFactor 1->3.
    topics:
      - name: topic-transfer-prepare
        partitions: 12
        replicationFactor: 3
      - name: topic-transfer-position
        partitions: 1
        replicationFactor: 3
      - name: topic-transfer-position-batch
        partitions: 8
        replicationFactor: 3
      - name: topic-transfer-fulfil
        partitions: 12
        replicationFactor: 3
      - name: topic-notification-event
        partitions: 30
        replicationFactor: 3
      - name: topic-transfer-get
        partitions: 1
        replicationFactor: 3
      - name: topic-admin-transfer
        partitions: 1
        replicationFactor: 3
      - name: topic-quotes-post
        partitions: 12
        replicationFactor: 3
      - name: topic-quotes-put
        partitions: 12
        replicationFactor: 3
      - name: topic-quotes-get
        partitions: 1
        replicationFactor: 3
      - name: topic-bulkquotes-post
        partitions: 1
        replicationFactor: 3
      - name: topic-bulkquotes-put
        partitions: 1
        replicationFactor: 3
      - name: topic-bulkquotes-get
        partitions: 1
        replicationFactor: 3
      - name: topic-bulk-prepare
        partitions: 1
        replicationFactor: 3
      - name: topic-bulk-fulfil
        partitions: 1
        replicationFactor: 3
      - name: topic-bulk-processing
        partitions: 1
        replicationFactor: 3
      - name: topic-bulk-get
        partitions: 1
        replicationFactor: 3
      - name: topic-fx-quotes-post
        partitions: 1
        replicationFactor: 3
      - name: topic-fx-quotes-put
        partitions: 1
        replicationFactor: 3
      - name: topic-fx-quotes-get
        partitions: 1
        replicationFactor: 3
      # Consumed by the centralsettlement deferred-settlement handler at
      # boot — every topic a deployed consumer subscribes to must be listed
      # here since auto.create.topics.enable=false.
      - name: topic-deferredsettlement-close
        partitions: 1
        replicationFactor: 3

## Reference: https://github.com/bitnamilegacy/charts/blob/main/bitnamilegacy/mysql/values.yaml
mysql:
  enabled: true

  tls:
    enabled: true

  fullnameOverride: "mysqldb"

  # Primary + 1 secondary, semi-sync.
  architecture: replication

  # MySQL metrics configuration
  metrics:
    # Resources for the metrics exporter
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 128Mi
        cpu: 100m

  ## MySQL Primary parameters
  primary:
    # MySQL runs its own protocol TLS — keep it OUT of the ambient mesh so
    # ztunnel doesn't double-encrypt already-encrypted database traffic.
    # Same posture as Kafka: datastores protocol-TLS, apps mesh-mTLS.
    podLabels:
      istio.io/dataplane-mode: none
    # One pod per dedicated mysql-tainted node — without this, nothing
    # stops primary+secondary landing on the same node, defeating the
    # point of replication. Chart default (mysql 14.0.3) is "soft",
    # overridden to "hard" since node count exactly matches replica count.
    podAntiAffinityPreset: hard
    # The taint toleration only *permits* the mysql nodes — nodeSelector is
    # what *requires* them. mysql-instance: primary pins this pod to
    # sw1-mysql-n1 specifically, since podAntiAffinityPreset alone doesn't
    # control which of the two nodes either replica prefers.
    nodeSelector:
      node-role: mysql
      mysql-instance: primary
    # io2, not gp3: MySQL's commit path under sync_binlog=1 +
    # innodb_flush_log_at_trx_commit=1 is frequent small synchronous
    # writes — the profile io2's per-IOPS provisioning is built for.
    # Apply the ebs-io2-encrypted StorageClass
    # (manifests/storage/ebs-io2-encrypted-storageclass.yaml, 10000 IOPS)
    # before this PVC is (re)created. Kafka stays on gp3.
    persistence:
      enabled: true
      storageClass: "ebs-io2-encrypted"
      size: 100Gi
    # Sized for m7i.2xlarge (8 vCPU/32GiB). Other pods on this node
    # (istio-cni, ztunnel, cilium, ebs-csi-node) claim ~0.5 core combined,
    # so limits/requests leave 1-2 cores of node headroom rather than
    # tracking vCPU count 1:1. Buffer pool sized to match (see
    # innodb_buffer_pool_size below).
    resources:
      limits:
        cpu: '7'
        ephemeral-storage: 150Gi
        # 32GiB node; buffer pool 8G + headroom for max_connections=6000
        # (most connections sit idle most of the time so this isn't a hard
        # per-connection multiply, but thread_stack alone is real
        # per-connection memory, and burst buffer usage under load needs
        # margin).
        memory: 28Gi
      requests:
        cpu: '6'
        ephemeral-storage: 50Gi
        memory: 22Gi

    # Durability and replication settings:
    # - log-bin/gtid/server-id: required for replication; GTID for reliable
    #   secondary positioning.
    # - innodb_flush_log_at_trx_commit=1: durable per-commit InnoDB redo
    #   log — what makes a committed transfer survive a crash.
    # - sync_binlog=1: per-commit binlog fsync, so the binlog stays a valid
    #   point-in-time-recovery source and a crash-recovered primary can't
    #   end up behind its own replica. Group commit amortizes the cost;
    #   the io2 volume below is provisioned for this write pattern.
    # - innodb_rollback_on_timeout=ON: MySQL's default (OFF) rolls back
    #   only the timed-out statement, leaving the transaction open — an
    #   app treating the error as failed can then commit a partial one.
    #   Startup-only; needs a restart to take effect.
    # - slow_query_log=ON, long_query_time=0.5, log_slow_extra=ON: digests
    #   give per-shape aggregates but never an individual execution's
    #   parameters/row counts. 0.5s is half the e2e budget. Not implemented
    #   here: a log volume separate from the data volume (writes currently
    #   share the commit path's IOPS) and size-capped rotation — community
    #   MySQL has no slow-log rate limiting.
    # - innodb_print_all_deadlocks=ON: SHOW ENGINE INNODB STATUS retains
    #   only the most recent deadlock; this logs full detail of both
    #   transactions instead. Costs nothing while deadlocks stay rare.
    # - innodb_io_capacity=5000 / _max=10000: derived from the data
    #   volume's provisioned IOPS, not measured demand — RESCALE both to
    #   the real storage before reusing this elsewhere, or checkpoint
    #   stalls result that look nothing like an I/O problem.
    # - lock_wait_timeout=60: metadata-lock (DDL) timeout, not row locks —
    #   innodb_lock_wait_timeout stays at default since completing a slow
    #   transfer beats rejecting it. MySQL's year-long DDL default turns a
    #   blocked migration into a stall that queues every later query on
    #   that table behind it.
    # - binlog_group_commit_sync_delay=0 (MySQL default, set explicitly): a
    #   nonzero delay widens batching at the cost of every commit's latency.
    # - semi-sync (rpl_semi_sync_source): primary blocks for the replica's
    #   ack before committing. The loose- prefix is required — mysqld
    #   --initialize ignores --plugin-load-add and hard-aborts on an
    #   unprefixed unknown variable at first boot.
    #   rpl_semi_sync_source_timeout=1000ms (MySQL default 10000ms): bounds
    #   how long an unresponsive replica stalls commits before falling back
    #   to async, comfortably inside this scenario's <1s budget. That
    #   fallback is silent — the primary keeps committing without it until
    #   the replica catches up — so any deployment relying on the
    #   durability property must alert on all three:
    #     increase(mysql_global_status_rpl_semi_sync_source_no_tx[5m]) > 0
    #     mysql_global_status_rpl_semi_sync_source_status == 0
    #     mysql_global_status_rpl_semi_sync_source_clients == 0
    #   Requires the exporter's slave_status collector.
    # - innodb_doublewrite=1: protects against partial-page-write
    #   corruption on crash.
    # - max_connections=6000: summed application connection-pool
    #   configuration (db_connection_pool_max x replicaCount across the
    #   direct-MySQL-touching services in mojaloop.yaml) totals ~4,500. A
    #   connection-slot ceiling fails hard rather than degrading, so this
    #   stays generous. thread_cache_size/table_open_cache scaled to match.
    # performance_schema is narrowed to the binlog/redo-log wait set plus
    # statement digests — full instrumentation costs ~240ms of transfer p99
    # at this load. Statement instruments stay on: they're the only
    # per-query latency source. Set here (not a live UPDATE) so it survives
    # a restart. The consumer=OFF lines matter because
    # --performance-schema-consumer-* only ever turns a consumer ON —
    # MySQL's own defaults (events_statements_history, both transaction
    # consumers) stay on unless disabled explicitly.
    #
    # Full instrumentation, for diagnosis that needs it. These are data,
    # not YAML comments, once inside extraFlags — a '#' here is passed
    # straight into mysqld's argv. Paste back unprefixed, remove the narrow
    # set below:
    #   --performance-schema-instrument=%=ON
    #   --performance-schema-consumer-events-waits-current=ON
    #   --performance-schema-consumer-events-waits-history=ON
    #   --performance-schema-consumer-events-waits-history-long=ON
    #   --performance-schema-consumer-events-statements-current=ON
    #   --performance-schema-consumer-events-statements-history=ON
    #   --performance-schema-consumer-events-statements-history-long=ON
    #   --performance-schema-consumer-events-stages-current=ON
    #   --performance-schema-consumer-events-stages-history=ON
    #   --performance-schema-consumer-events-stages-history-long=ON
    #   --performance-schema-consumer-events-transactions-current=ON
    #   --performance-schema-consumer-events-transactions-history=ON
    #   --performance-schema-consumer-events-transactions-history-long=ON
    #   --performance-schema-consumer-global-instrumentation=ON
    #   --performance-schema-consumer-thread-instrumentation=ON
    #   --performance-schema-consumer-statements-digest=ON
    # binlog_expire_logs_seconds=14400: with semi-sync-only replication and
    # this scenario's write volume, MySQL's 30-day default lets segments
    # accumulate past the data volume's capacity within about a day. This
    # 4h window is a test-environment disk constraint, not a production
    # value — it bounds how long the secondary may be offline before the
    # primary purges binlogs it still needs (replication then stops with
    # error 1236 and can't resume without a re-seed). Size it to the
    # longest replica outage that must survive without one.
    extraFlags: |
      --max_connections=6000
      --log-bin=mysql-bin
      --server-id=1
      --gtid_mode=ON
      --enforce-gtid-consistency=ON
      --binlog_format=ROW
      --sync_binlog=1
      --innodb_flush_log_at_trx_commit=1
      --binlog_group_commit_sync_delay=0
      --binlog_expire_logs_seconds=14400
      --plugin-load-add=rpl_semi_sync_source=semisync_source.so
      --loose-rpl-semi-sync-source-enabled=ON
      --loose-rpl-semi-sync-source-timeout=1000
      --innodb_buffer_pool_size=8G
      --innodb_buffer_pool_instances=8
      --innodb_redo_log_capacity=2G
      --innodb_log_buffer_size=256M
      --innodb_flush_method=O_DIRECT
      --innodb_io_capacity=5000
      --innodb_io_capacity_max=10000
      --innodb_read_io_threads=8
      --innodb_write_io_threads=8
      --innodb_doublewrite=1
      --innodb_rollback_on_timeout=ON
      --innodb_print_all_deadlocks=ON
      --slow_query_log=ON
      --long_query_time=0.5
      --log_slow_extra=ON
      --lock_wait_timeout=60
      --performance-schema-instrument=%=OFF
      --performance-schema-instrument=statement/%=ON
      --performance-schema-instrument=wait/synch/cond/sql/MYSQL_BIN_LOG%=ON
      --performance-schema-instrument=wait/synch/mutex/sql/MYSQL_BIN_LOG%=ON
      --performance-schema-instrument=wait/io/file/innodb/innodb_log_file=ON
      --performance-schema-consumer-global-instrumentation=ON
      --performance-schema-consumer-thread-instrumentation=ON
      --performance-schema-consumer-events-waits-current=ON
      --performance-schema-consumer-events-statements-current=ON
      --performance-schema-consumer-statements-digest=ON
      --performance-schema-consumer-events-statements-history=OFF
      --performance-schema-consumer-events-transactions-current=OFF
      --performance-schema-consumer-events-transactions-history=OFF
      --thread_cache_size=200
      --table_open_cache=8000
      --table_definition_cache=4000
      --tmp_table_size=256M
      --max_heap_table_size=256M
      --performance_schema=ON
      --skip_name_resolve=ON

  ## MySQL Secondary parameters — sized identically to primary, not smaller.
  ## Semi-sync means the primary can't commit until the secondary acks, so
  ## an undersized secondary throttles the primary's write throughput too,
  ## not just its own capacity.
  secondary:
    replicaCount: 1
    podLabels:
      istio.io/dataplane-mode: none
    podAntiAffinityPreset: hard
    # mysql-instance: secondary pins this pod to sw1-mysql-n2 specifically —
    # see primary's nodeSelector comment above for why this is needed.
    nodeSelector:
      node-role: mysql
      mysql-instance: secondary
    # common/backend/17.1.0.yaml only sets this toleration under
    # mysql.primary — without it, nodeSelector alone leaves secondary
    # unschedulable.
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "mysql"
        effect: "NoSchedule"
    # The mysql chart mounts primary's initdbScripts ConfigMap onto
    # secondary too, but common/backend/17.1.0.yaml only defines the
    # matching extraEnvVars under mysql.primary — without these, the
    # scripts abort with "unbound variable" here. Scripts are idempotent
    # (DROP ... IF EXISTS before every CREATE), so re-running them is safe.
    extraEnvVars:
      - name: ACCOUNT_LOOKUP_DATABASE
        value: "account_lookup"
      - name: ACCOUNT_LOOKUP_USER
        value: "account_lookup"
      - name: CENTRAL_LEDGER_DATABASE
        value: "central_ledger"
      - name: CENTRAL_LEDGER_USER
        value: "central_ledger"
      - name: CONTENT_ORACLE_DATABASE
        value: "consent_oracle"
      - name: CONTENT_ORACLE_USER
        value: "consent_oracle"
      - name: AUTH_SVC_DATABASE
        value: "auth_svc"
      - name: AUTH_SVC_USER
        value: "auth_svc"
      - name: MSISDN_ORACLE_DATABASE
        value: "oracle_msisdn"
      - name: MSISDN_ORACLE_USER
        value: "oracle_msisdn"
    # Same io2 switch as primary — see primary's persistence comment above.
    persistence:
      enabled: true
      storageClass: "ebs-io2-encrypted"
      size: 100Gi
    resources:
      limits:
        cpu: '7'
        ephemeral-storage: 150Gi
        # Matches primary's bump — see primary's memory comment above.
        memory: 28Gi
      requests:
        cpu: '6'
        ephemeral-storage: 50Gi
        memory: 22Gi
    # server-id must be unique per node. read_only/super_read_only prevent
    # accidental direct writes — app traffic points at the `mysqldb`
    # service alias (primary only), but super_read_only also closes the
    # gap read_only leaves: a connection holding SUPER could otherwise
    # write directly and diverge the replica silently. Buffer pool/IO/
    # connection/performance_schema tuning matches primary throughout —
    # sized identically, not as a smaller backup box, since semi-sync means
    # an undersized secondary throttles the primary's commit latency too.
    # sync_binlog=1000 here while the primary runs 1 — deliberate.
    # replica_preserve_commit_order serialises the applier's commit stage,
    # leaving group commit almost nothing to batch, so per-commit fsync
    # here would make the replica apply at roughly half the primary's
    # write rate and fall progressively behind. Durability is unaffected:
    # semi-sync acknowledges on relay-log receipt regardless of how the
    # replica's own binlog is synced, and relay_log_recovery makes it
    # crash-safe without per-commit durability of that binlog.
    # relay_log_recovery=ON: semi-sync's ack means the event reached the
    # relay log, but sync_relay_log defaults to 10000 so that write is only
    # fsynced periodically — without recovery, a crashed replica resumes
    # from a relay log missing acked events and silently drops them. With
    # it ON the relay log is discarded and refetched from the source.
    # binlog_expire_logs_seconds=14400 matches primary — gtid_mode=ON
    # means this secondary runs its own binary log too, exposed to the
    # same unbounded-retention disk risk.
    extraFlags: |
      --server-id=2
      --max_connections=6000
      --gtid_mode=ON
      --enforce-gtid-consistency=ON
      --binlog_format=ROW
      --sync_binlog=1000
      --innodb_flush_log_at_trx_commit=1
      --binlog_expire_logs_seconds=14400
      --plugin-load-add=rpl_semi_sync_replica=semisync_replica.so
      --loose-rpl-semi-sync-replica-enabled=ON
      --relay_log_recovery=ON
      --log_slow_replica_statements=ON
      --read_only=ON
      --super_read_only=ON
      --replica_parallel_type=LOGICAL_CLOCK
      --replica_parallel_workers=7
      --innodb_buffer_pool_size=8G
      --innodb_buffer_pool_instances=8
      --innodb_redo_log_capacity=2G
      --innodb_log_buffer_size=256M
      --innodb_flush_method=O_DIRECT
      --innodb_io_capacity=5000
      --innodb_io_capacity_max=10000
      --innodb_read_io_threads=8
      --innodb_write_io_threads=8
      --innodb_doublewrite=1
      --innodb_rollback_on_timeout=ON
      --innodb_print_all_deadlocks=ON
      --slow_query_log=ON
      --long_query_time=0.5
      --log_slow_extra=ON
      --lock_wait_timeout=60
      --performance-schema-instrument=%=OFF
      --performance-schema-instrument=statement/%=ON
      --performance-schema-instrument=wait/synch/cond/sql/MYSQL_BIN_LOG%=ON
      --performance-schema-instrument=wait/synch/mutex/sql/MYSQL_BIN_LOG%=ON
      --performance-schema-instrument=wait/io/file/innodb/innodb_log_file=ON
      --performance-schema-consumer-global-instrumentation=ON
      --performance-schema-consumer-thread-instrumentation=ON
      --performance-schema-consumer-events-waits-current=ON
      --performance-schema-consumer-events-statements-current=ON
      --performance-schema-consumer-statements-digest=ON
      --performance-schema-consumer-events-statements-history=OFF
      --performance-schema-consumer-events-transactions-current=OFF
      --performance-schema-consumer-events-transactions-history=OFF
      --thread_cache_size=200
      --table_open_cache=8000
      --table_definition_cache=4000
      --tmp_table_size=256M
      --max_heap_table_size=256M
      --performance_schema=ON
      --skip_name_resolve=ON

proxy-cache-redis:
  enabled: false

# Datastores with no clients in this deployment profile: central-ledger
# object store is DISABLED (MONGODB.DISABLED=true in every cl config), TTK
# reporting is unconfigured, the auth service is not deployed, and both
# redis instances show zero app connections. Disabled rather than TLS'd —
# no traffic exists to encrypt.
cl-mongodb:
  enabled: false
# ttk-mongodb stays enabled: the testing-toolkit backend's init container
# requires its secret and connection even with reporting unconfigured. Kept
# out of the ambient mesh so ztunnel doesn't intercept a connection that
# needs neither protocol-TLS nor app-mTLS (same-namespace, same-cluster pair).
ttk-mongodb:
  enabled: true
  podLabels:
    istio.io/dataplane-mode: none
ttksims-redis:
  enabled: false
auth-svc-redis:
  enabled: false