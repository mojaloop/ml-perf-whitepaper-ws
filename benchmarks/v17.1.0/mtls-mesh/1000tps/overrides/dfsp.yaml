# Per-scenario DFSP simulator overrides — layered on top of
# common/dfsp/values-fspNNN.yaml by the dfsp role's per_fsp loop.

# scheme-adapter image pin: adds Prometheus latency/event-loop-lag/backend-
# call-duration instrumentation the stock image doesn't expose.

# Sim backend replicas per FSP (single-threaded process, ~1 core each).
# Backend CPU load is driven by the DESTINATION role only (payee-side
# party/quote/transfer lookups) — source-only FSPs measure ~0 backend
# CPU regardless of traffic share, so only fsp202 (destination under the
# skewed fsp201->fsp202 pairing) needs more than 1. Every backend pod is
# seeded individually by `make provision`.
dfsp_backend_replicas_default: 1
dfsp_backend_replicas:
  fsp202: 4

# scheme-adapter replicas per FSP. fsp201/fsp202 carry the skewed
# fsp201->fsp202 pairing's traffic concentration (up to 70%/49% of total
# volume) and need headroom above the flat-weight baseline; both nodes are
# sized c7i.4xlarge (16 vCPU, see aws.yaml). fsp203-208 run above the role
# default too (c7i.2xlarge, 8 vCPU each).
dfsp_sdk_replicas_default: 4
dfsp_sdk_replicas:
  fsp201: 32
  fsp202: 32
  fsp203: 12
  fsp204: 12
  fsp205: 12
  fsp206: 12
  fsp207: 12
  fsp208: 12

# Redis cache maxmemory. At 200mb the caches sit at the ceiling and evict
# continuously (allkeys-lru) under sustained load. Measured harmless: what gets
# evicted is state for completed transfers, and keyspace_misses stays at 0, so
# no lookup ever fails to find its key. There is memory headroom to raise this,
# but doing so changes SDK cache behaviour and therefore what the scenario
# measures, so it stays at the role default.
dfsp_cache_maxmemory: 200mb


simulators:
  fsp201:
    config:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4004"
        prometheus.io/path: "/"
      schemeAdapter:
        env:
          ENABLE_TEST_FEATURES: "false"
          LOG_LEVEL: "info"
        image:
          repository: mojaloop/sdk-scheme-adapter
          tag: "v24.20.0"
          pullPolicy: Always
      backend:
        env:
          LOG_LEVEL: "info"
