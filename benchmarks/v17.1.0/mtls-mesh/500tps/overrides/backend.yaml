# Database values for Mojaloop Performance Testing
# This file configures MySQL and Kafka with proper node placement

## Global settings to allow bitnamilegacy images
global:
  security:
    allowInsecureImages: true

## Reference: https://github.com/bitnamilegacy/charts/blob/main/bitnamilegacy/kafka/values.yaml
kafka:
  enabled: true
  fullnameOverride: "kafka"

  # Kafka protocol TLS — same pattern as MySQL (chart auto-generated
  # self-signed certs; clients run encrypt-only: security.protocol=ssl with
  # certificate verification disabled in their rdkafkaConf). The client
  # listener keeps port 9092 so no address changes anywhere; plaintext is no
  # longer accepted. Controller/interbroker stay PLAINTEXT: single-broker
  # KRaft — that traffic never leaves the pod.
  listeners:
    client:
      protocol: SSL
    external:
      protocol: SSL
  tls:
    type: PEM
    autoGenerated: true
    # Encrypt-only, matching the MySQL posture: clients connect without
    # certificates ("required" would demand mTLS from every rdkafka client).
    sslClientAuth: none
    # The chart's upgrade-passwords check requires these to be non-empty on
    # every `helm upgrade` once TLS is enabled; pinning them keeps re-runs
    # idempotent. Not credentials that guard anything — certs are
    # auto-generated per install.
    keystorePassword: "perf-kafka-keystore"
    truststorePassword: "perf-kafka-truststore"

  extraConfig: |-
    # Topics come exclusively from the provisioning job. Auto-creation is a
    # correctness hazard: a client racing ahead of provisioning creates the
    # topic with 1 partition, provisioning's --if-not-exists then skips it,
    # and consumer groups sized for N partitions never get assignments.
    auto.create.topics.enable=false
    offsets.topic.replication.factor=1
    default.replication.factor=1
    transaction.state.log.replication.factor=1
    log.retention.ms=300000
    log.retention.check.interval.ms=30000
    log.segment.bytes=16777216
    log.segment.ms=60000

  controller:
    # Kafka runs its own protocol TLS (above) — keep it OUT of the ambient
    # mesh so ztunnel doesn't double-encrypt the bulk stream on this node.
    # Same posture as the database: datastores protocol-TLS, apps mesh-mTLS.
    podLabels:
      istio.io/dataplane-mode: none
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
        ephemeral-storage: "20Gi"
      limits:
        cpu: "3"
        memory: "8Gi"
        ephemeral-storage: "30Gi"

    overrideConfiguration: |
      default.replication.factor=1
      min.insync.replicas=1
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      transaction.state.log.min.isr=1

      delete.topic.enable=true
    
      num.network.threads=12
      num.io.threads=16
      background.threads=4
      queued.max.requests=2000

      socket.send.buffer.bytes=4194304
      socket.receive.buffer.bytes=4194304

      log.dirs=/opt/kafka/data
      # 16MB segments (was 128MB): ~150 partitions x active-segment => plateau ~3-5GB
      # instead of ~14GB. Combined with segment.ms=60000 + retention.ms=5min so retention
      # trims closed segments continuously. Real eviction cause was the 2Gi ephemeral limit
      # (jmx sidecar preset) exposed by removing the explicit limit, now set to 30Gi above.
      log.segment.bytes=16777216
      log.segment.ms=60000
      log.flush.interval.messages=9223372036854775807
      log.flush.interval.ms=9223372036854775807
      log.retention.ms=300000
      log.retention.bytes=134217728
      log.retention.check.interval.ms=30000
      log.cleanup.policy=delete
      log.cleaner.enable=true

      offsets.retention.minutes=5
      offsets.retention.check.interval.ms=30000

      group.initial.rebalance.delay.ms=0
      compression.type=producer

    extraEnvVars:
      # - name: KAFKA_HEAP_OPTS
      #   value: "-Xms6g -Xmx6g"
      - name: KAFKA_JVM_PERFORMANCE_OPTS
        value: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=45 -XX:+ExplicitGCInvokesConcurrent -XX:+ParallelRefProcEnabled -Djava.awt.headless=true"

  provisioning:
    enabled: true
    waitForKafka: true
    persistence:
      enabled: false
    # The provisioning job is itself a Kafka client: point it at the
    # auto-generated broker cert secret so it trusts the SSL listener. The
    # *SecretKey fields must be blanked — their chart defaults trip the
    # "must not be used without passwordsSecret" validation.
    auth:
      tls:
        type: PEM
        certificatesSecret: kafka-tls
        cert: kafka.crt
        key: kafka.key
        caCert: kafka-ca.crt
        keyPasswordSecretKey: ""
        keystorePasswordSecretKey: ""
        truststorePasswordSecretKey: ""
    # The job's generated client.properties includes a keystore built from the
    # auto-generated PEM key, which the Java client cannot parse (PKCS#1 vs
    # PKCS#8) — topic creation then fails while the job still reports success.
    # With an encrypt-only listener (sslClientAuth: none) no client key is
    # needed: rewrite the config truststore-only before the topic commands run.
    preScript: |
      {
        echo "security.protocol=SSL"
        echo "ssl.truststore.type=PEM"
        awk 'BEGIN{printf "ssl.truststore.certificates="} NR>1{print line" \\"}{line=$0}END{print $0" "}' /certs/kafka-ca.crt
      } > /tmp/client.properties
    topics:
      - name: topic-transfer-prepare
        partitions: 12
        replicationFactor: 1
      - name: topic-transfer-position
        partitions: 1
        replicationFactor: 1
      - name: topic-transfer-position-batch
        partitions: 8
        replicationFactor: 1
      - name: topic-transfer-fulfil
        partitions: 12
        replicationFactor: 1
      - name: topic-notification-event
        partitions: 18
        replicationFactor: 1
      - name: topic-transfer-get
        partitions: 1
        replicationFactor: 1
      - name: topic-admin-transfer
        partitions: 1
        replicationFactor: 1
      - name: topic-quotes-post
        partitions: 12
        replicationFactor: 1
      - name: topic-quotes-put
        partitions: 12
        replicationFactor: 1
      - name: topic-quotes-get
        partitions: 1
        replicationFactor: 1
      - name: topic-bulkquotes-post
        partitions: 1
        replicationFactor: 1
      - name: topic-bulkquotes-put
        partitions: 1
        replicationFactor: 1
      - name: topic-bulkquotes-get
        partitions: 1
        replicationFactor: 1
      - name: topic-bulk-prepare
        partitions: 1
        replicationFactor: 1
      - name: topic-bulk-fulfil
        partitions: 1
        replicationFactor: 1
      - name: topic-bulk-processing
        partitions: 1
        replicationFactor: 1
      - name: topic-bulk-get
        partitions: 1
        replicationFactor: 1
      - name: topic-fx-quotes-post
        partitions: 1
        replicationFactor: 1
      - name: topic-fx-quotes-put
        partitions: 1
        replicationFactor: 1
      - name: topic-fx-quotes-get
        partitions: 1
        replicationFactor: 1
      # Consumed by the centralsettlement deferred-settlement handler at boot.
      # With auto.create.topics.enable=false the provisioning list must cover
      # every topic a deployed consumer subscribes to.
      - name: topic-deferredsettlement-close
        partitions: 1
        replicationFactor: 1

## Reference: https://github.com/bitnamilegacy/charts/blob/main/bitnamilegacy/mysql/values.yaml
mysql:
  enabled: true

  tls:
    enabled: true

  fullnameOverride: "mysqldb"

  # MySQL metrics configuration
  metrics:
    # Resources for the metrics exporter
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 128Mi
        cpu: 100m

  ## MySQL Primary parameters
  primary:
    # MySQL runs its own protocol TLS — keep it OUT of the ambient mesh so
    # ztunnel doesn't double-encrypt already-encrypted database traffic.
    # Same posture as Kafka: datastores protocol-TLS, apps mesh-mTLS.
    # NOTE: applying this label restarts the (ephemeral) MySQL StatefulSet —
    # a full onboard/provision cycle is required afterwards.
    podLabels:
      istio.io/dataplane-mode: none
    persistence:
      enabled: false
      size: 50Gi
    # OPTIMIZED RESOURCES - m7i.2xlarge (8 vCPU / 32 GB)
    resources:
      limits:
        cpu: '3'              # 3 of 4 vCPUs on m7i.xlarge (leave 1 for OS/system); peak 2.13c @500TPS RF=1 (06-30)
        ephemeral-storage: 150Gi
        memory: 12Gi          # was 14Gi — m7i.xlarge is 16GiB node; real use ~10-12GiB (buffer pool 8G+redo 2G), leaves ~3GiB OS
      requests:
        cpu: '2'              # Guaranteed CPUs
        ephemeral-storage: 50Gi
        memory: 9Gi           # Guaranteed memory (node mem peak 11.8GiB incl OS @500TPS)


    extraFlags: |
      --max_connections=1000
      --skip-log-bin
      --innodb_buffer_pool_size=8G
      --innodb_buffer_pool_instances=8
      --innodb_redo_log_capacity=2G
      --innodb_log_buffer_size=256M
      --innodb_flush_method=O_DIRECT
      --innodb_io_capacity=3000
      --innodb_io_capacity_max=6000
      --innodb_read_io_threads=8
      --innodb_write_io_threads=8
      --innodb_doublewrite=0
      --thread_cache_size=100
      --table_open_cache=4000
      --table_definition_cache=4000
      --tmp_table_size=256M
      --max_heap_table_size=256M
      --sync_binlog=0
      --innodb_flush_log_at_trx_commit=2
      --performance_schema=OFF
      --skip_name_resolve=ON
    # For production/persistence: set innodb_flush_log_at_trx_commit=1 and sync_binlog=1
    #   --slow_query_log=0
    #   --performance_schema=OFF
    #   --skip_name_resolve
    #   --default_authentication_plugin=mysql_native_password    
  

proxy-cache-redis:
  enabled: false

# Datastores with no clients in this deployment profile — verified live:
# central-ledger object store is DISABLED (MONGODB.DISABLED=true in every cl
# config), TTK reporting is unconfigured (REPORTING_DB_CONNECTION_STRING=null),
# the auth service is not deployed, and both redis instances show zero app
# connections. Disabled rather than TLS'd: no traffic exists to encrypt.
cl-mongodb:
  enabled: false
# ttk-mongodb stays enabled: the testing-toolkit backend's init container
# requires its secret and connection even with reporting unconfigured.
ttk-mongodb:
  enabled: true
ttksims-redis:
  enabled: false
auth-svc-redis:
  enabled: false