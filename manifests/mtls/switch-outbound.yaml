# ---- DestinationRule × 8 --------------------------------------------------
# MUTUAL TLS origination on port 443. credentialName references a Secret in
# the egress gateway's namespace (istio-system). SNI is the DFSP hostname so
# the DFSP's ssl-passthrough Ingress can route on it.
#
# maxRequestsPerConnection recycles connections periodically to prevent
# unbounded Envoy per-connection stats accumulation. h2UpgradePolicy is
# DO_NOT_UPGRADE because the SDK scheme-adapter doesn't negotiate H2 via ALPN
# in SSL-passthrough mode — otherwise HTTP/2 frames leak back to the
# notification handler's HTTP/1.1 parser and crash it.
#
# outlierDetection is a circuit-breaker: ejects hosts returning 5xx gateway
# errors for baseEjectionTime, preventing a wedged DFSP from absorbing its
# full weight indefinitely.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: sim-fsp201
  namespace: mojaloop
spec:
  host: sim-fsp201.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 500
        connectTimeout: 10s
        tcpKeepalive:
          time: 600s
          interval: 75s
          probes: 9
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 500
        maxRequestsPerConnection: 1000
        idleTimeout: 35s
        h2UpgradePolicy: DO_NOT_UPGRADE
    outlierDetection:
      consecutiveGatewayErrors: 50
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    portLevelSettings:
      - port: { number: 443 }
        tls:
          mode: MUTUAL
          credentialName: switch-mtls-creds
          sni: sim-fsp201.local
