# Retired — superseded by sidecar mTLS origination (mtls_switch role). Kept
# only for the manual rollback path (manifests/mtls/sidecar-runbook.md).
#
# Switch outbound mTLS via Istio Egress Gateway (Leg B): originates mTLS
# from switch -> DFSP simulators (sim-fspNNN.local:443).
#
# Flow: switch app pods carry hostAliases mapping sim-fspNNN.local to the
# egress gateway's pinned ClusterIP (10.152.183.253) and send plain HTTP :80.
# The Gateway below receives it; the VirtualService rewrites
# /sim/fspNNN/inbound/ -> / and routes to port 443 on the ServiceEntry host;
# the DestinationRule applies MUTUAL TLS using switch-mtls-creds, with SNI
# set to the DFSP hostname so the DFSP's ssl-passthrough Ingress can route
# on it. The gateway pod itself resolves sim-fspNNN.local via CoreDNS (no
# hostAliases), so it reaches the real DFSPs.
#
# Prerequisites: Istio installed (istiod + istio-cni); switch-mtls-creds
# Secret in istio-system; istio-egressgateway Helm release with the pinned
# ClusterIP above; switch CoreDNS hosts{} block listing real DFSP IPs; switch
# app pods with hostAliases pointing at the gateway's ClusterIP.

# ---- Gateway --------------------------------------------------------------
# In istio-system, selects pods with `istio: egressgateway` (set by the
# Helm values in common/istio-egressgateway.yaml). Listens on :80 HTTP.
# `hosts: mojaloop/sim-fspNNN.local` says "accept these hosts when bound to
# a VS in the mojaloop namespace" — keeps the VS in mojaloop while the
# gateway sits in istio-system.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: dfsp-egress
  namespace: istio-system
spec:
  selector:
    istio: egressgateway
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts:
        - mojaloop/sim-fsp201.local
        - mojaloop/sim-fsp202.local
        - mojaloop/sim-fsp203.local
        - mojaloop/sim-fsp204.local
        - mojaloop/sim-fsp205.local
        - mojaloop/sim-fsp206.local
        - mojaloop/sim-fsp207.local
        - mojaloop/sim-fsp208.local
---
# ---- ServiceEntry × 8 -----------------------------------------------------
# Defines each sim-fspNNN.local as a MESH_EXTERNAL host on port 443.
#
# resolution: STATIC — hardcoded DFSP node IPs (from coredns-corefile-mtls.yaml).
#   Avoids periodic STRICT_DNS re-resolution churn (Envoy re-fires
#   updateHosts() on every CoreDNS hosts{} TTL expiry); STATIC bypasses DNS
#   entirely, matching how the ingress gateway already works (static K8s
#   service ClusterIPs). Update IPs here whenever DFSP nodes are re-provisioned.
#
# No `istio.io/use-waypoint` label — we are not using ambient/waypoint here.
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: sim-fsp201
  namespace: mojaloop
spec:
  hosts: [sim-fsp201.local]
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - { number: 443, name: https, protocol: HTTPS }
  endpoints:
    - address: 10.112.2.169
---
