# ---- DestinationRule × 8 --------------------------------------------------
# MUTUAL TLS origination on port 443. credentialName references a Secret in
# the egress gateway's namespace (istio-system). SNI is the DFSP hostname so
# the DFSP nginx ssl-passthrough Ingress can route on it.
#
# connectionPool — balanced sizing for 500 TPS mTLS workload:
#   At 500 TPS with 4 pods (125 TPS/pod), fsp201 (70% load) receives ~350
#   parties+quotes+transfers callbacks/sec = ~87/sec per egress pod. At 10s
#   timeout and 87/sec, worst-case queue depth is ~870 → http1MaxPendingRequests
#   set to 1000 (headroom above peak). Setting it too low (< 100) caused 503
#   Overflow for ALS callbacks before they reached DFSPs, making things worse.
#   maxConnections: 500 — sufficient for 87/sec per pod at ~300ms avg latency
#   http1MaxPendingRequests: 1000 — headroom above 870 worst-case for fsp201
#   http2MaxRequests: 500 — consistent with maxConnections ceiling
#   maxRequestsPerConnection: 100 — recycle connections after 100 requests.
#     Prevents unbounded Envoy per-connection stats accumulation (observed:
#     211Mi → 1963Mi per egress pod over 1000s with 0; ingress stayed flat at
#     221Mi with recycling). TLS session resumption costs ~1-2ms per handshake;
#     at ~8 active connections/pod recycling every ~2s the overhead is <1%.
#   idleTimeout: 35s — slightly above VS timeout; clears stale connections
#   h2UpgradePolicy: DO_NOT_UPGRADE — SDK scheme-adapter does not negotiate H2 via ALPN in
#   SSL-passthrough mode; leaving UPGRADE causes HTTP/2 binary frames to leak back to
#   notification handler's HTTP/1.1 parser → HPE_INVALID_CONSTANT crash
#
# outlierDetection — circuit-breaker: ejects hosts that return 5xx gateway
#   errors (Envoy 503 from upstream exhaustion) for baseEjectionTime, then
#   retries. Prevents a wedged DFSP from absorbing its full weight indefinitely.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: sim-fsp201
  namespace: mojaloop
spec:
  host: sim-fsp201.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 500
        connectTimeout: 10s
        tcpKeepalive:
          time: 600s
          interval: 75s
          probes: 9
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 500
        maxRequestsPerConnection: 1000
        idleTimeout: 35s
        h2UpgradePolicy: DO_NOT_UPGRADE
    outlierDetection:
      consecutiveGatewayErrors: 50
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    portLevelSettings:
      - port: { number: 443 }
        tls:
          mode: MUTUAL
          credentialName: switch-mtls-creds
          sni: sim-fsp201.local
---
