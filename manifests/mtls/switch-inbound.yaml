# Switch inbound mTLS (Leg A). Creates the Istio path for DFSP -> switch mTLS
# traffic on port 443:
#   - Gateway: binds to istio-ingressgateway, terminates mTLS (tls.mode: MUTUAL),
#     validates DFSP client certs against the shared CA in switch-mtls-creds.
#   - VirtualServices: route each mTLS host to its in-cluster Service (port 80).
#
# Additive — nginx continues serving the same hostnames on :80, so traffic
# behaviour is unchanged until the DFSP SDKs flip to HTTPS:443 with their
# client cert.
#
# Applied by: ansible/roles/mtls_switch/tasks/main.yml
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: switch-mtls-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https-mtls
        protocol: HTTPS
      tls:
        mode: MUTUAL
        credentialName: switch-mtls-creds
        # TLS hardening (server / Leg A inbound). 1.2 floor, 1.3 negotiated when
        # the DFSP client supports it (not pinned 1.3-only — the DFSP TLS stack
        # is unverified and a 1.3-only floor would break interop). cipherSuites
        # is ECDSA + AES-GCM only (matches the P-256 cert, AES-NI accelerated),
        # AES-128-GCM first; it governs the TLS 1.2 fallback (1.3 AEAD selection
        # is fixed in BoringSSL). The Leg B client/origination side is pinned
        # mesh-wide via meshConfig.tlsDefaults (common/istiod-values.yaml) —
        # a DestinationRule's ClientTLSSettings has no cipherSuites field.
        minProtocolVersion: TLSV1_2
        cipherSuites:
          - ECDHE-ECDSA-AES128-GCM-SHA256
          - ECDHE-ECDSA-AES256-GCM-SHA384
      hosts:
        - account-lookup-service.local
        - quoting-service.local
        - ml-api-adapter.local
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: account-lookup-service-mtls
  namespace: istio-system
spec:
  hosts:
    - account-lookup-service.local
  gateways:
    - switch-mtls-gateway
  http:
    - timeout: 30s
      route:
        - destination:
            host: moja-account-lookup-service.mojaloop.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: quoting-service-mtls
  namespace: istio-system
spec:
  hosts:
    - quoting-service.local
  gateways:
    - switch-mtls-gateway
  http:
    - timeout: 30s
      route:
        - destination:
            host: moja-quoting-service.mojaloop.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ml-api-adapter-service-mtls
  namespace: istio-system
spec:
  hosts:
    - ml-api-adapter.local
  gateways:
    - switch-mtls-gateway
  http:
    - timeout: 30s
      route:
        - destination:
            host: moja-ml-api-adapter-service.mojaloop.svc.cluster.local
            port:
              number: 80
