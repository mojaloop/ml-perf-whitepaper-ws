# ============================================================================
# NodePort exposure for the MicroK8s nginx ingress controller (:80).
# ============================================================================
# The Cilium eBPF CNI (kubeProxyReplacement=false) does not program hostPort,
# so the nginx-ingress-microk8s-controller DaemonSet's hostPort :80 stopped
# forwarding. Cilium DOES implement NodePort, so this additive Service exposes
# the same nginx pods on nodePort 30080 -> container :80. The NLB :80 listener +
# health check target this. We do NOT modify the MicroK8s addon DaemonSet; the
# stale hostPort is harmless (ignored by Cilium).
#
# Selector matches the MicroK8s ingress addon pod label
# (name=nginx-ingress-microk8s). VERIFY on your build:
#   kubectl -n ingress get pod --show-labels | grep nginx
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress-nodeport
  namespace: ingress
  labels:
    app: nginx-ingress-nodeport
spec:
  type: NodePort
  selector:
    name: nginx-ingress-microk8s
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
