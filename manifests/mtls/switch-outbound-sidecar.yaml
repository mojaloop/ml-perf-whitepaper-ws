# Static snapshot for reference only — the ansible mtls_switch role renders
# the live version of this manifest from templates/switch-outbound-sidecar.yaml.j2
# with current DFSP IPs; this file's endpoint addresses go stale immediately.
#
# Switch outbound mTLS via Istio sidecars (Leg B): mTLS origination happens
# in each calling pod's own Envoy sidecar rather than a centralized gateway.
#
# Path: switch pod -> http://sim-fspNNN.local/sim/fspNNN/inbound/... (plain
# HTTP :80) -> hostAliases resolves to the real DFSP node IP -> the pod's own
# sidecar intercepts (includeOutboundIPRanges = DFSP /32s) -> VirtualService
# rewrites /sim/fspNNN/inbound/ -> / -> DestinationRule originates MUTUAL TLS
# to :443 using file-mounted certs (sidecar SDS doesn't load a DestinationRule
# credentialName secret the way gateways do, so the certs are mounted into
# istio-proxy instead) -> DFSP nginx ssl-passthrough -> scheme-adapter
# (validates client cert). Requires the switch-mtls-creds Secret mounted into
# the istio-proxy sidecar of the outbound deployments — see sidecar-runbook.md.
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: sim-fsp201
  namespace: mojaloop
spec:
  hosts: [sim-fsp201.local]
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - { number: 80,  name: http,  protocol: HTTP }   # the port the app connects on
    - { number: 443, name: https, protocol: HTTPS }  # TLS-origination target
  endpoints:
    - address: 10.112.2.169
---
