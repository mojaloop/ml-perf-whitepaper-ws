apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: sim-fsp201
  namespace: mojaloop
spec:
  hosts: [sim-fsp201.local]
  gateways: [mesh]            # sidecar-local routing, not a named Gateway resource
  http:
    - match:
        - uri: { prefix: /sim/fsp201/inbound/ }
      rewrite:
        uri: /
      timeout: 30s
      route:
        - destination:
            host: sim-fsp201.local
            port: { number: 443 }
