apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: sim-fsp201
  namespace: mojaloop
spec:
  host: sim-fsp201.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 500
        connectTimeout: 10s
        tcpKeepalive: { time: 600s, interval: 75s, probes: 9 }
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 500
        maxRequestsPerConnection: 1000
        idleTimeout: 35s
        h2UpgradePolicy: DO_NOT_UPGRADE
    outlierDetection:
      consecutiveGatewayErrors: 50
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    portLevelSettings:
      - port: { number: 443 }
        tls:
          mode: MUTUAL
          clientCertificate: /etc/istio/mtls-certs/tls.crt
          privateKey: /etc/istio/mtls-certs/tls.key
          caCertificates: /etc/istio/mtls-certs/ca.crt
          sni: sim-fsp201.local
