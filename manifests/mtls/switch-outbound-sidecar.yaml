# ============================================================================
# Switch outbound mTLS via Istio SIDECARS (Leg B) — replaces gateway mode
# ============================================================================
# Moves mTLS origination OFF the centralized istio-egressgateway and INTO each
# calling pod's own Envoy sidecar. Eliminates the in-cluster double-hop
# (switch pod -> egress GW pod -> DFSP) that drove ~6 cores of softirq.
#
# Path now:
#   switch pod (notification/quoting-handler/ALS)
#     -> http://sim-fspNNN.local/sim/fspNNN/inbound/...   (plain HTTP :80)
#     -> hostAliases resolves sim-fspNNN.local -> DFSP node IP (NOT the egress GW)
#     -> pod's OWN sidecar intercepts (includeOutboundIPRanges = DFSP /32s)
#     -> VirtualService (gateways:[mesh]) rewrites /sim/fspNNN/inbound/ -> /
#     -> DestinationRule originates MUTUAL TLS to :443 using FILE-MOUNTED certs
#        (sidecar SDS does NOT load a DR credentialName secret — gateways do, sidecars
#         don't; verified on istiod 1.24.1. So we mount switch-mtls-creds into the
#         istio-proxy container and reference file paths instead.)
#     -> DFSP nginx ssl-passthrough -> scheme-adapter (validates client cert)
#
# REQUIRES the switch-mtls-creds Secret mounted into the istio-proxy sidecar of the
# 3 outbound deployments, via these pod-template annotations (see sidecar-runbook.md):
#   sidecar.istio.io/userVolume:      [{"name":"mtls-certs","secret":{"secretName":"switch-mtls-creds"}}]
#   sidecar.istio.io/userVolumeMount: [{"name":"mtls-certs","mountPath":"/etc/istio/mtls-certs","readOnly":true}]
#
# Apply: kubectl apply -f manifests/mtls/switch-outbound-sidecar.yaml
# Rollback: kubectl apply -f manifests/mtls/switch-outbound.yaml
# ============================================================================
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: sim-fsp201
  namespace: mojaloop
spec:
  hosts: [sim-fsp201.local]
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - { number: 80,  name: http,  protocol: HTTP }   # the port the app connects on
    - { number: 443, name: https, protocol: HTTPS }  # TLS-origination target
  endpoints:
    - address: 10.112.2.169
---
