[defaults]
host_key_checking = False
roles_path = ./roles
remote_user = ubuntu
# Default is 10s — too tight for a slow/high-latency path, especially
# through the ProxyJump hop (bastion negotiation + target negotiation).
# ControlPersist reuses the connection for 30m after it succeeds once,
# so this only costs extra wait on the first connection per host per run.
timeout = 60
# private_key_file is set via ANSIBLE_PRIVATE_KEY_FILE env var by the
# root Makefile, derived from SSH_KEY_NAME in the root .env.
stdout_callback = ansible.builtin.default
result_format = yaml
callback_enabled = timer
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ServerAliveInterval=60
pipelining = True