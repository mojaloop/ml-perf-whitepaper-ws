---
# Registers MSISDN parties on the DFSP simulator backends.
#
# The backend stores parties in a PER-PROCESS in-memory sqlite, so seeding
# goes pod-by-pod (kubectl exec into every backend pod, POST via the local
# test-api) rather than through the sim ingress/Service, which would
# round-robin parties across replicas and leave each pod with a partial set.
#
# The backend readiness probe always returns 200, so a restarted pod goes
# Ready with an EMPTY party db — re-run `make provision` after any backend
# pod restart (or `make dfsp`) and before every test run. Idempotent:
# duplicate POSTs return ID_NOT_UNIQUE and count as already-seeded.

sim_count_per_fsp: 1000

# Parallel POSTs per batch inside each backend pod.
sim_seed_concurrency: 25

# Backend test-api port (in-pod).
sim_seed_port: 3003

# Per-FSP seed set: `primary` is the FSP's own MSISDN (also registered by TTK
# onboarding, but only onto ONE pod — re-seeded here so every replica has it);
# `base` starts a sequential range of `count` (default sim_count_per_fsp)
# discovery targets. Bases match als_provision (an MSISDN reachable in ALS
# must resolve to a party registered on its target sim). fsp201 is
# source-only: primary only, no range.
sim_fsp_msisdn_bases:
  - { fsp: fsp201, primary: "17039811918", count: 0 }
  - { fsp: fsp202, primary: "17039811919", base: 17039811929 }
  - { fsp: fsp203, primary: "17039811920", base: 37039811929 }
  - { fsp: fsp204, primary: "17039811921", base: 47039811929 }
  - { fsp: fsp205, primary: "17039811922", base: 57039811929 }
  - { fsp: fsp206, primary: "17039811923", base: 67039811929 }
  - { fsp: fsp207, primary: "17039811924", base: 77039811929 }
  - { fsp: fsp208, primary: "17039811925", base: 87039811929 }
