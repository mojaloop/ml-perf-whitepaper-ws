---
# Switch-side mTLS — Leg A (inbound, ingress GW) + Leg B (outbound, SIDECAR mode).
# This role:
#  - Installs Gateway API CRDs + istio-base + istiod + istio-ingressgateway
#  - Patches nginx (frees :443 for the Istio ingress gateway)
#  - Applies Leg A inbound resources (cert + Gateway + VirtualServices + upstream pool)
#  - Leg B: copies the mTLS cert into the mojaloop namespace, renders+applies the
#    sidecar ServiceEntry/VirtualService/DestinationRule set, injects an istio-proxy
#    sidecar into the 3 egress deployments (scoped to the DFSP IP ranges, certs
#    file-mounted), points their hostAliases at the real DFSP node IPs, and retires
#    the old egress gateway.
#
# Why sidecar over egress gateway: the centralized gateway forced a switch-pod ->
# egress-GW-pod -> DFSP double-hop that cost ~6 cores of kernel softirq and
# collapsed 500 TPS mTLS to ~365 TPS. Sidecar mTLS origination removes the hop;
# 500 TPS mTLS passes at e2e p99 = 778 ms. See docs/500tps-mtls-sidecar-result.md.

istio_version: "{{ chart_versions.istio }}"
gateway_api_url: >-
  https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml

# Istio helm install resilience. The base/istiod/ingress installs run large
# server-side-apply operations over the bastion SOCKS tunnel; a transient API
# stall can blow the request deadline and leave the release in `pending-upgrade`.
# Retry the whole helm op (the 2nd attempt is fast once CRDs are established).
istio_helm_timeout: 10m
istio_helm_retries: 3
istio_helm_retry_delay: 20

istiod_values:         "{{ common_dir }}/istiod-values.yaml"
ingressgateway_values: "{{ common_dir }}/istio-ingressgateway.yaml"

# Leg A (inbound) static manifests — unchanged from gateway mode.
mtls_switch_inbound:        "{{ repo_root }}/manifests/mtls/switch-inbound.yaml"
mtls_switch_upstream_pool:  "{{ repo_root }}/manifests/mtls/switch-upstream-pool.yaml"
mtls_switch_tls_secret:     "{{ repo_root }}/certs/switch-tls-secret.yaml"

# DFSP node IPs / hostAliases emitted fresh each run by playbook 06.
# Used to (a) render the sidecar Leg B manifest with the live endpoint IPs and
# (b) re-point the egress deployments' hostAliases at the real DFSP nodes.
mojaloop_hostaliases_json:  "{{ scenario_artifacts_dir }}/hostaliases.json"

# ----------------------------------------------------------------------------
# Leg B — sidecar mode
# ----------------------------------------------------------------------------
# The mTLS client cert/key/CA. Applied to istio-system for Leg A (Gateway
# credentialName) and copied into mojaloop so the sidecars can file-mount it.
mtls_certs_secret_name: switch-mtls-creds
mtls_certs_mount_path:  /etc/istio/mtls-certs

# Rendered sidecar Leg B manifest (SE/VS/DR x8), built from the template.
mtls_sidecar_outbound_manifest: "{{ scenario_artifacts_dir }}/switch-outbound-sidecar.yaml"

# DestinationRule / VirtualService tunables (proven values from the 500 TPS run).
mtls_sidecar_route_timeout:      30s
mtls_sidecar_max_connections:    500
mtls_sidecar_http2_max_requests: 500

# Egress deployments that originate Leg B mTLS via their own injected sidecar.
#  egress_only: true  -> pure Kafka-consumer handler (no ingress traffic). Disable
#                        inbound interception (includeInboundPorts:"") — nothing to
#                        terminate, and it keeps the sidecar's job to egress only.
#  egress_only: false -> dual-role (also receives ingress-GW Leg A traffic). KEEP
#                        inbound interception so the ingress GW's auto-mTLS is
#                        terminated by this sidecar — disabling it yields a Leg A
#                        503 TLS WRONG_VERSION_NUMBER.
# (These three match the switch role's mojaloop_hostalias_deployments.)
mtls_sidecar_deployments:
  - name: moja-account-lookup-service
    egress_only: false
  - name: moja-quoting-service-handler
    egress_only: true
  - name: moja-ml-api-adapter-handler-notification
    egress_only: true

# Per-deployment rollout wait — Kafka-consuming handlers rejoin their group slowly.
mtls_sidecar_rollout_timeout: 1200s

# Retire the egress-gateway resources superseded by sidecar mode (safe no-op if
# they were never installed). Set false to leave a prior gateway install in place.
mtls_cleanup_egressgateway: true

# Retired egress-gateway artifacts (referenced only by the cleanup + the manual
# rollback runbook at manifests/mtls/sidecar-runbook.md).
mtls_switch_outbound:   "{{ repo_root }}/manifests/mtls/switch-outbound.yaml"
mtls_egressgw_service:  "{{ repo_root }}/manifests/mtls/egressgateway-service.yaml"
egressgateway_values:   "{{ common_dir }}/istio-egressgateway.yaml"
egressgateway_pinned_ip: 10.152.183.253
