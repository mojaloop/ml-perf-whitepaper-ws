---
- name: "fsp{{ fsp_idx }}: set facts"
  ansible.builtin.set_fact:
    fsp_name: "fsp{{ fsp_idx }}"
    kc_fsp: "{{ kubeconfig_dir }}/kubeconfig-fsp{{ fsp_idx }}.yaml"
    fsp_sdk_deploy: "{{ dfsp_sdk_deploy_prefix }}fsp{{ fsp_idx }}{{ dfsp_sdk_deploy_suffix }}"

# Fail early and clearly rather than half-applying the cutover — mirrors
# mtls_switch's own egress-deployment check.
- name: "fsp{{ fsp_idx }}: check the scheme-adapter deployment exists"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} get deployment {{ fsp_sdk_deploy }} -o name
  register: _sdk_deploy_check
  changed_when: false
  failed_when: false
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: fail clearly if scheme-adapter deployment is missing"
  ansible.builtin.fail:
    msg: >-
      Expected deployment {{ fsp_sdk_deploy }} in namespace {{ ns_dfsps }} on
      {{ fsp_name }}, but kubectl returned rc={{ _sdk_deploy_check.rc }}.
      Deploy the DFSP simulators first:  make dfsp SCENARIO={{ scenario }}
  when: _sdk_deploy_check.rc != 0

# --- Istio control plane (own istiod per cluster, mirrors the switch) ---

- name: "fsp{{ fsp_idx }}: helm install istio-base"
  ansible.builtin.shell: |
    helm --kubeconfig={{ kc_fsp }} -n {{ ns_istio }} upgrade --install \
      istio-base istio/base --create-namespace --version {{ istio_version }} \
      --timeout {{ istio_helm_timeout }} \
      --force-conflicts --take-ownership
  register: _h_base
  retries: "{{ istio_helm_retries }}"
  delay: "{{ istio_helm_retry_delay }}"
  until: _h_base.rc == 0
  changed_when: "'has been upgraded' in _h_base.stdout or 'has been deployed' in _h_base.stdout"
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: helm install istiod (same TLS-hardening values as the switch)"
  ansible.builtin.shell: |
    helm --kubeconfig={{ kc_fsp }} -n {{ ns_istio }} upgrade --install \
      istiod istio/istiod --version {{ istio_version }} --wait \
      --timeout {{ istio_helm_timeout }} \
      --force-conflicts --take-ownership \
      -f {{ istiod_values }}
  register: _h_istiod
  retries: "{{ istio_helm_retries }}"
  delay: "{{ istio_helm_retry_delay }}"
  until: _h_istiod.rc == 0
  changed_when: "'has been upgraded' in _h_istiod.stdout or 'has been deployed' in _h_istiod.stdout"
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: helm install istio-ingressgateway (NodePort {{ dfsp_istio_gateway_nodeport }}, single-node values)"
  ansible.builtin.shell: |
    helm --kubeconfig={{ kc_fsp }} -n {{ ns_istio }} upgrade --install \
      istio-ingressgateway istio/gateway \
      --version {{ istio_version }} --wait --skip-schema-validation \
      --timeout {{ istio_helm_timeout }} \
      --force-conflicts --take-ownership \
      -f {{ ingressgateway_dfsp_values }}
  register: _h_ingw
  retries: "{{ istio_helm_retries }}"
  delay: "{{ istio_helm_retry_delay }}"
  until: _h_ingw.rc == 0
  changed_when: "'has been upgraded' in _h_ingw.stdout or 'has been deployed' in _h_ingw.stdout"
  environment: "{{ kubectl_env }}"

# --- PeerAuthentication STRICT for the dfsps namespace ---
# Same shape as the ambient role's namespace-wide STRICT policy
# (security.istio.io/v1, name "default" = the namespace-wide default policy).

- name: "fsp{{ fsp_idx }}: apply STRICT PeerAuthentication for {{ ns_dfsps }}"
  when: dfsp_peer_auth_strict | bool
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} apply -f - <<'EOF'
    apiVersion: security.istio.io/v1
    kind: PeerAuthentication
    metadata:
      name: default
      namespace: {{ ns_dfsps }}
    spec:
      mtls:
        mode: STRICT
    EOF
  register: _pa
  changed_when: "'created' in _pa.stdout or 'configured' in _pa.stdout"
  environment: "{{ kubectl_env }}"

# --- Ensure the shared DFSP TLS secret exists ---
# mtls_dfsp's per_fsp.yml also applies this same manifest, but mtls.yml runs
# istio_dfsp BEFORE mtls_dfsp — so this role can't assume that's happened
# yet. Applying it here too is idempotent (mtls_dfsp's later apply is just a
# harmless no-op re-apply of the same content).
- name: "fsp{{ fsp_idx }}: apply shared DFSP TLS secret ({{ dfsp_shared_secret_name }})"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} apply -f {{ dfsp_tls_secret }}
  register: _dfsp_tls_secret
  changed_when: "'created' in _dfsp_tls_secret.stdout or 'configured' in _dfsp_tls_secret.stdout"
  environment: "{{ kubectl_env }}"

# --- Import the shared lab cert into istio-system (DFSP inbound Gateway trust) ---
# Same jq-transform idiom mtls_switch uses to copy its cert secret between
# namespaces — here it also renames keys (inbound-*.pem -> tls.crt/key/ca.crt)
# since the source Secret is Opaque-shaped for the chart's own /secrets mount,
# not the kubernetes.io/tls shape a Gateway credentialName expects.
- name: "fsp{{ fsp_idx }}: build {{ dfsp_mtls_creds_secret_name }} from the shared cert secret"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} get secret {{ dfsp_shared_secret_name }} -o json \
      | jq '{
          apiVersion: "v1",
          kind: "Secret",
          metadata: { name: "{{ dfsp_mtls_creds_secret_name }}", namespace: "{{ ns_istio }}", labels: { app: "mtls-lab" } },
          type: "kubernetes.io/tls",
          data: {
            "ca.crt":  .data["inbound-cacert.pem"],
            "tls.crt": .data["inbound-cert.pem"],
            "tls.key": .data["inbound-key.pem"]
          }
        }' \
      | kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_istio }} apply -f -
  register: _cert_import
  changed_when: "'created' in _cert_import.stdout or 'configured' in _cert_import.stdout"
  environment: "{{ kubectl_env }}"

# --- DFSP inbound (switch's Leg B): Gateway + VirtualService, terminates the switch's mTLS ---

- name: "fsp{{ fsp_idx }}: render DFSP inbound manifest"
  ansible.builtin.template:
    src: "{{ mtls_dfsp_inbound_tmpl }}"
    dest: "{{ scenario_artifacts_dir }}/dfsp-{{ fsp_name }}-istio-inbound.yaml"
    mode: '0644'

- name: "fsp{{ fsp_idx }}: apply DFSP inbound manifest"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} apply -f {{ scenario_artifacts_dir }}/dfsp-{{ fsp_name }}-istio-inbound.yaml
  register: _legA
  changed_when: "'created' in _legA.stdout or 'configured' in _legA.stdout"
  environment: "{{ kubectl_env }}"

# --- DFSP outbound (switch's Leg A): scheme-adapter sidecar originates mTLS to the switch ---
# Replaces OUTBOUND_MUTUAL_TLS_ENABLED (the app's own https.Agent client).
# Content is identical across all 8 FSPs (same switch_lb_ip target, same 3
# switch hostnames) but is applied per-cluster since each fspNNN is a
# separate kubeconfig.

- name: "fsp{{ fsp_idx }}: render DFSP outbound sidecar manifest"
  ansible.builtin.template:
    src: "{{ mtls_dfsp_outbound_tmpl }}"
    dest: "{{ scenario_artifacts_dir }}/dfsp-{{ fsp_name }}-istio-outbound.yaml"
    mode: '0644'

- name: "fsp{{ fsp_idx }}: apply DFSP outbound sidecar manifest"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} apply -f {{ scenario_artifacts_dir }}/dfsp-{{ fsp_name }}-istio-outbound.yaml
  register: _legB
  changed_when: "'created' in _legB.stdout or 'configured' in _legB.stdout"
  environment: "{{ kubectl_env }}"

# --- Sidecar injection on the scheme-adapter deployment ---
# Outbound interception scoped to switch_lb_ip/32 ONLY, so the sidecar never
# touches the scheme-adapter's local calls to sim-backend/cache — mirrors the
# switch's own DFSP /32 scoping for its egress sidecars.
#
# Inbound interception is scoped to ONLY port {{ dfsp_sdk_inbound_port }}
# (the Gateway-routed mTLS port) — NOT left at chart default. The chart also
# exposes OUTBOUND_LISTEN_PORT (4001, reached directly by nginx's separate
# plain-HTTP `dfsp-sim-simulators` Ingress for DFSP-initiated transfers) and
# TEST_LISTEN_PORT (4002) on the same pod. Namespace-wide PeerAuthentication
# STRICT means any port the sidecar intercepts demands mesh mTLS — leaving
# interception unscoped silently broke nginx's plain-HTTP calls to 4001
# (caught via a live smoke-test failure: empty response body, connection
# reset by the sidecar since nginx isn't a mesh-aware caller). Kubelet
# probes are unaffected either way — Istio auto-rewrites those around the
# sidecar regardless of includeInboundPorts.
- name: "fsp{{ fsp_idx }}: patch scheme-adapter for sidecar injection"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} patch deployment {{ fsp_sdk_deploy }} \
      --type=merge -p {{ {
        'spec': {'template': {
          'metadata': {
            'labels': {'sidecar.istio.io/inject': 'true'},
            'annotations': {
              'sidecar.istio.io/userVolume': '[{"name":"mtls-certs","secret":{"secretName":"' ~ dfsp_shared_secret_name ~ '"}}]',
              'sidecar.istio.io/userVolumeMount': '[{"name":"mtls-certs","mountPath":"' ~ mtls_certs_mount_path ~ '","readOnly":true}]',
              'proxy.istio.io/config': '{"holdApplicationUntilProxyStarts":true}',
              'sidecar.istio.io/proxyMemoryLimit': dfsp_sidecar_proxy_memory_limit,
              'traffic.sidecar.istio.io/includeOutboundIPRanges': (switch_lb_ip ~ '/32'),
              'traffic.sidecar.istio.io/includeInboundPorts': (dfsp_sdk_inbound_port | string)
            }
          }
        }}
      } | to_json | quote }}
  register: _sidecar_patch
  changed_when: "'patched' in _sidecar_patch.stdout"
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: wait for scheme-adapter rollout"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} \
      rollout status deployment {{ fsp_sdk_deploy }} --timeout={{ dfsp_sidecar_rollout_timeout }}
  changed_when: false
  environment: "{{ kubectl_env }}"

# istio-proxy runs the distroless proxyv2 image (no shell), so cert presence
# can't be exec-checked — a pod that reached 2/2 Ready already proves the
# secret-backed volume mounted (a missing/malformed Secret blocks the pod at
# ContainerCreating). Mirrors mtls_switch's own verification approach.
#
# Label is `sim-<fsp>-scheme-adapter` (prefixed), confirmed against the
# vendored chart's templates/deployment.yaml and templates/service.yaml —
# NOT `<fsp>-scheme-adapter` as first guessed here; caught via a live label
# mismatch during the first real deploy (empty selector match), not local
# review, since the vendored chart source wasn't cross-checked for this one
# specific label before writing it.
- name: "fsp{{ fsp_idx }}: verify scheme-adapter pods are 2/2 (app + istio-proxy)"
  ansible.builtin.shell: |
    set -e
    PODS=$(kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} get pods \
      -l app.kubernetes.io/name=sim-{{ fsp_name }}-scheme-adapter \
      --field-selector=status.phase=Running \
      -o jsonpath='{.items[*].metadata.name}')
    [ -n "$PODS" ]
    READY=$(kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} get pods \
      -l app.kubernetes.io/name=sim-{{ fsp_name }}-scheme-adapter \
      --field-selector=status.phase=Running \
      -o jsonpath='{.items[*].status.containerStatuses[*].ready}')
    echo "$READY" | tr ' ' '\n' | grep -qv false
  changed_when: false
  environment: "{{ kubectl_env }}"
