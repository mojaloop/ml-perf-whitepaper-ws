---
# Per-FSP body. fsp_idx (e.g. 201) supplied by the parent loop in main.yml.
# Renders one self-contained agent stack (ns + RBAC + node-exporter +
# prometheus-agent) and applies it to that cluster's kubeconfig.

- name: "fsp{{ fsp_idx }}: set facts"
  ansible.builtin.set_fact:
    fsp_name: "fsp{{ fsp_idx }}"
    kc_fsp: "{{ kubeconfig_dir }}/kubeconfig-fsp{{ fsp_idx }}.yaml"

- name: "fsp{{ fsp_idx }}: render agent stack manifest"
  ansible.builtin.template:
    src: agent-stack.yaml.j2
    dest: "{{ scenario_artifacts_dir }}/dfsp-{{ fsp_name }}-monitoring.yaml"
    mode: '0644'

- name: "fsp{{ fsp_idx }}: apply agent stack"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} apply -f {{ scenario_artifacts_dir }}/dfsp-{{ fsp_name }}-monitoring.yaml
  register: _mon_apply
  changed_when: "'created' in _mon_apply.stdout or 'configured' in _mon_apply.stdout"
  environment: "{{ kubectl_env }}"

# A ConfigMap change doesn't restart the agent pod on its own, so re-runs
# (e.g. scrape-config edits) would otherwise be no-ops. Restart to guarantee
# the agent loads the freshly applied prometheus.yml. Cheap — one small pod.
- name: "fsp{{ fsp_idx }}: restart agent to load latest config"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ dfsp_mon_namespace }} \
      rollout restart deployment dfsp-prometheus-agent
  changed_when: false
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: wait for node-exporter DaemonSet"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ dfsp_mon_namespace }} \
      rollout status daemonset dfsp-node-exporter --timeout=120s
  changed_when: false
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: wait for prometheus-agent"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ dfsp_mon_namespace }} \
      rollout status deployment dfsp-prometheus-agent --timeout=120s
  changed_when: false
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: report remote_write target"
  ansible.builtin.debug:
    msg: >-
      fsp{{ fsp_idx }} agent shipping metrics to {{ dfsp_mon_remote_write_url }}
      with external label cluster={{ fsp_name }}. Verify centrally:
      up{cluster="{{ fsp_name }}"}
