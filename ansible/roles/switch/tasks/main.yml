---
- name: Pre-flight
  ansible.builtin.import_role:
    name: _common

- name: Filter to existing values files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ mojaloop_values_files }}"
  register: _moja_values_stat

- name: Build helm -f arg list
  ansible.builtin.set_fact:
    _moja_values_args: >-
      {{ _moja_values_stat.results
         | selectattr('stat.exists')
         | map(attribute='item')
         | map('regex_replace', '^(.*)$', '-f \1')
         | join(' ') }}

- name: Helm install/upgrade Mojaloop switch
  ansible.builtin.shell: |
    helm --kubeconfig={{ kc_switch }} -n {{ ns_mojaloop }} upgrade --install \
      {{ mojaloop_release }} {{ mojaloop_chart }} \
      --version {{ mojaloop_version }} \
      {{ _moja_values_args }} \
      --wait --timeout 15m
  register: _moja_helm
  changed_when: "'has been upgraded' in _moja_helm.stdout or 'has been deployed' in _moja_helm.stdout"
  environment: "{{ kubectl_env }}"

- name: Apply NetworkPolicy (optional)
  when: apply_network_policy
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_switch }} -n {{ ns_mojaloop }} apply -f {{ mojaloop_network_policy }}
  register: _np
  changed_when: "'created' in _np.stdout or 'configured' in _np.stdout"
  environment: "{{ kubectl_env }}"

# ---- Per-scenario configmap overrides ----
# Applied first so the single Recreate rollout (triggered by the topology patch
# below) picks up both configmap content and topology constraints in one shot.

- name: Stat scenario configmaps directory
  ansible.builtin.stat:
    path: "{{ scenario_dir }}/configmaps"
  register: _cm_dir_stat

- name: Patch Mojaloop configmaps from scenario overrides
  when: _cm_dir_stat.stat.exists
  ansible.builtin.shell: |
    file="{{ scenario_dir }}/configmaps/{{ item.value }}"
    if [ -f "$file" ]; then
      kubectl --kubeconfig={{ kc_switch }} -n {{ ns_mojaloop }} patch configmap {{ item.key }} \
        --type merge -p "$(jq -n --arg cfg "$(cat $file)" '{data: {"default.json": $cfg}}')"
    else
      echo "skip: $file not present"
    fi
  loop: "{{ mojaloop_configmap_patches | dict2items }}"
  register: _cm_patch
  changed_when: "'patched' in (_cm_patch.stdout | default(''))"
  environment: "{{ kubectl_env }}"

# ---- Deployment topology patches ----
# Each deployment gets exactly one patch that sets:
#   strategy: Recreate  — kills all pods at once so the topology scheduler
#                         starts from a clean slate (no skewed baseline)
#   topologySpreadConstraints:
#     hostname  DoNotSchedule + nodeTaintsPolicy:Honor
#               Honor excludes tainted infra nodes (kafka, mysql) from the
#               domain count so only the 4 generic switch nodes are eligible.
#     zone      ScheduleAnyway (best-effort)
#
# Callback deployments also receive hostAliases (DFSP node IPs) in the same
# patch so only one rollout is triggered per deployment. The mtls_switch role
# (sidecar mode) re-applies these same real DFSP IPs and injects an istio-proxy
# so each pod originates Leg B mTLS directly (no egress gateway).

- name: Stat hostAliases JSON
  ansible.builtin.stat:
    path: "{{ mojaloop_hostaliases_json }}"
  register: _ha_stat

- name: Patch callback deployments — Recreate + topology + hostAliases
  when: _ha_stat.stat.exists
  ansible.builtin.shell: |
    ha=$(jq '.spec.template.spec.hostAliases' {{ mojaloop_hostaliases_json }})
    kubectl --kubeconfig={{ kc_switch }} -n {{ ns_mojaloop }} patch deployment {{ item.deploy }} \
      --type=merge -p "$(jq -n --arg app '{{ item.app }}' --argjson ha "$ha" '{
        spec: {
          strategy: {type: "Recreate", rollingUpdate: null},
          template: {spec: {
            hostAliases: $ha,
            topologySpreadConstraints: [
              {maxSkew: 1, topologyKey: "kubernetes.io/hostname",
               whenUnsatisfiable: "DoNotSchedule",
               nodeAffinityPolicy: "Honor", nodeTaintsPolicy: "Honor",
               labelSelector: {matchLabels: {"app.kubernetes.io/name": $app}}},
              {maxSkew: 1, topologyKey: "topology.kubernetes.io/zone",
               whenUnsatisfiable: "ScheduleAnyway",
               labelSelector: {matchLabels: {"app.kubernetes.io/name": $app}}}
            ]
          }}
        }
      }')"
  loop: "{{ mojaloop_callback_topology_deployments }}"
  register: _callback_patch
  changed_when: "'patched' in _callback_patch.stdout"
  environment: "{{ kubectl_env }}"

- name: Patch multi-replica deployments — Recreate + topology
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_switch }} -n {{ ns_mojaloop }} patch deployment {{ item.deploy }} \
      --type=merge -p "$(jq -n --arg app '{{ item.app }}' '{
        spec: {
          strategy: {type: "Recreate", rollingUpdate: null},
          template: {spec: {topologySpreadConstraints: [
            {maxSkew: 1, topologyKey: "kubernetes.io/hostname",
             whenUnsatisfiable: "DoNotSchedule",
             nodeAffinityPolicy: "Honor", nodeTaintsPolicy: "Honor",
             labelSelector: {matchLabels: {"app.kubernetes.io/name": $app}}},
            {maxSkew: 1, topologyKey: "topology.kubernetes.io/zone",
             whenUnsatisfiable: "ScheduleAnyway",
             labelSelector: {matchLabels: {"app.kubernetes.io/name": $app}}}
          ]}}
        }
      }')"
  loop: "{{ mojaloop_topology_deployments }}"
  register: _topo_patch
  changed_when: "'patched' in _topo_patch.stdout"
  environment: "{{ kubectl_env }}"

- name: Patch singleton deployments — soft anti-affinity across switch nodes
  ansible.builtin.shell: |
    if kubectl --kubeconfig={{ kc_switch }} get deployment {{ item }} -n {{ ns_mojaloop }} &>/dev/null; then
      kubectl --kubeconfig={{ kc_switch }} -n {{ ns_mojaloop }} patch deployment {{ item }} \
        --type=merge -p '{"spec":{"template":{"spec":{"affinity":{"podAntiAffinity":{
          "preferredDuringSchedulingIgnoredDuringExecution":[{
            "weight":100,
            "podAffinityTerm":{
              "topologyKey":"kubernetes.io/hostname",
              "labelSelector":{"matchExpressions":[{
                "key":"app.kubernetes.io/instance",
                "operator":"In",
                "values":["moja"]
              }]}
            }
          }]
        }}}}}}'
    fi
  loop: "{{ mojaloop_singleton_deployments }}"
  register: _singleton_patch
  changed_when: "'patched' in _singleton_patch.stdout"
  environment: "{{ kubectl_env }}"

- name: Patch TTK StatefulSet with hostAliases
  when: _ha_stat.stat.exists
  ansible.builtin.shell: |
    ha=$(jq '.spec.template.spec.hostAliases' {{ mojaloop_hostaliases_json }})
    kubectl --kubeconfig={{ kc_switch }} -n {{ ns_mojaloop }} patch statefulset moja-ml-testing-toolkit-backend \
      --type=strategic --patch "$(jq -n --argjson ha "$ha" \
        '{"spec":{"template":{"spec":{"hostAliases":$ha}}}}')"
  changed_when: false
  environment: "{{ kubectl_env }}"

# ---- Wait for rollouts ----
# Recreate rollouts triggered by the topology patches above.

- name: Wait for multi-replica deployment rollouts
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_switch }} -n {{ ns_mojaloop }} \
      rollout status deployment {{ item }} --timeout=600s
  loop: "{{ mojaloop_restart_deployments }}"
  changed_when: false
  environment: "{{ kubectl_env }}"
