---
# Per-FSP loop body for dfsp_mtls_mode=istio (default). Requires the
# istio_dfsp role to have already run for this scenario — it installs the
# per-cluster istiod/Gateway/PeerAuthentication and patches sidecar
# injection onto the scheme-adapter deployment. This task file only:
# applies the shared cert secret (also consumed by istio_dfsp's trust-chain
# import), disables the app's inbuilt TLS via the mTLS values overlay, and
# re-applies the imperative replica scale the helm upgrade resets.

- name: "fsp{{ fsp_idx }}: set facts"
  ansible.builtin.set_fact:
    fsp_name: "fsp{{ fsp_idx }}"
    kc_fsp: "{{ kubeconfig_dir }}/kubeconfig-fsp{{ fsp_idx }}.yaml"

- name: "fsp{{ fsp_idx }}: apply shared DFSP TLS secret"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} apply -f {{ dfsp_tls_secret }}
  register: _dfsp_secret
  changed_when: "'created' in _dfsp_secret.stdout or 'configured' in _dfsp_secret.stdout"
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: render mTLS values overlay (inbuilt TLS disabled)"
  ansible.builtin.template:
    src: mtls-values.yaml.j2
    dest: "{{ scenario_artifacts_dir }}/mtls-{{ fsp_name }}-values.yaml"
    mode: '0644'

- name: "fsp{{ fsp_idx }}: helm upgrade scheme-adapter with mTLS overlay"
  ansible.builtin.shell: |
    helm --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} upgrade {{ dfsp_release }} {{ dfsp_chart }} \
      --version {{ dfsp_version }} \
      --reuse-values \
      --values {{ scenario_artifacts_dir }}/mtls-{{ fsp_name }}-values.yaml \
      --force-conflicts --take-ownership \
      --wait --timeout 10m
  register: _mtls_helm
  changed_when: "'has been upgraded' in _mtls_helm.stdout or 'has been deployed' in _mtls_helm.stdout"
  environment: "{{ kubectl_env }}"

# Unrelated to the passthrough/TLS mechanism being replaced — keeps the
# simulator UI/API Ingress reachable over plain HTTP regardless of mTLS mode.
- name: "fsp{{ fsp_idx }}: disable ssl-redirect on simulator Ingress"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} annotate ingress dfsp-sim-simulators \
      nginx.ingress.kubernetes.io/ssl-redirect=false --overwrite
  changed_when: false
  environment: "{{ kubectl_env }}"

# The mTLS helm upgrade above runs with --reuse-values --take-ownership, which
# resets scheme-adapter .spec.replicas to the chart default (1) and wipes the
# imperative scale the dfsp role applied. Re-apply it here so the deploy ends
# with the intended replica counts; new replicas inherit both the disabled-TLS
# env vars AND the sidecar-injection pod template istio_dfsp already patched
# in, so they come up already fully mTLS-via-Istio.
- name: "fsp{{ fsp_idx }}: re-scale scheme-adapter replicas after mTLS overlay"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} scale deployment dfsp-sim-fsp{{ fsp_idx }}-scheme-adapter \
      --replicas={{ dfsp_sdk_replicas[fsp_name] | default(dfsp_sdk_replicas_default) }}
  changed_when: false
  environment: "{{ kubectl_env }}"

- name: "fsp{{ fsp_idx }}: re-scale sim backend replicas after mTLS overlay"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_fsp }} -n {{ ns_dfsps }} scale deployment dfsp-sim-{{ fsp_name }}-backend \
      --replicas={{ dfsp_backend_replicas[fsp_name] | default(dfsp_backend_replicas_default) }}
  changed_when: false
  environment: "{{ kubectl_env }}"
