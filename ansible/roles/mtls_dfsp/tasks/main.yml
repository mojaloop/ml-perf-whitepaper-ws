---
- name: Pre-flight
  ansible.builtin.import_role:
    name: _common

- name: Ensure mojaloop helm repo is present
  ansible.builtin.shell: |
    helm repo add mojaloop {{ helm_repos.mojaloop }} 2>/dev/null || true
    helm repo update mojaloop
  changed_when: false
  environment: "{{ helm_repo_env }}"

- name: Per-DFSP mTLS loop (Istio-managed — default)
  when: dfsp_mtls_mode == 'istio'
  ansible.builtin.include_tasks: per_fsp.yml
  loop: "{{ dfsp_indices }}"
  loop_control:
    loop_var: fsp_idx

- name: Per-DFSP mTLS loop (legacy nginx ssl-passthrough — rollback only)
  when: dfsp_mtls_mode == 'nginx-passthrough'
  ansible.builtin.include_tasks: per_fsp_nginx_passthrough.yml
  loop: "{{ dfsp_indices }}"
  loop_control:
    loop_var: fsp_idx
