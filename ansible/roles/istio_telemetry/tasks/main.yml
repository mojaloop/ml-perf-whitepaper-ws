---
- name: Pre-flight
  ansible.builtin.import_role:
    name: _common

- name: Assert PodMonitor CRD exists (prometheus-operator installed by monitoring stage)
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_switch }} get crd podmonitors.monitoring.coreos.com -o name
  changed_when: false
  environment: "{{ kubectl_env }}"
  register: _podmon_crd
  failed_when: _podmon_crd.rc != 0
  # If this fails: run `make monitoring SCENARIO={{ scenario }}` first.

- name: Render Istio telemetry monitors
  ansible.builtin.template:
    src: podmonitor.yaml.j2
    dest: "{{ scenario_artifacts_dir }}/istio-telemetry.yaml"
    mode: '0644'

- name: Apply PodMonitor + istiod ServiceMonitor
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_switch }} apply -f {{ scenario_artifacts_dir }}/istio-telemetry.yaml
  register: _mon_apply
  changed_when: "'created' in _mon_apply.stdout or 'configured' in _mon_apply.stdout"
  environment: "{{ kubectl_env }}"

# --- optional: widen raw Envoy stats via proxyStatsMatcher (rolls workloads) ---
- name: Widen Envoy stats inclusion (proxyStatsMatcher) — optional, causes rollout
  when: istio_telemetry_widen_envoy_stats | bool
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ kc_switch }} -n {{ item.ns }} patch deployment {{ item.deploy }} \
      --type=merge -p '{"spec":{"template":{"metadata":{"annotations":{
        "proxy.istio.io/config":"proxyStatsMatcher:\n  inclusionPrefixes:\n  - cluster.outbound\n  - listener\n  - http\n  - tcp\n  - cluster_manager"
      }}}}}'
    kubectl --kubeconfig={{ kc_switch }} -n {{ item.ns }} rollout status deployment {{ item.deploy }} --timeout=180s
  loop: "{{ istio_telemetry_widen_targets }}"
  changed_when: false
  environment: "{{ kubectl_env }}"

- name: Report verification queries
  ansible.builtin.debug:
    msg: >-
      Istio telemetry scrape applied. After ~1 scrape interval, verify centrally
      (Prometheus :9090):
      sum by(destination_service_name)(rate(istio_requests_total[1m]))  — per-leg volume;
      histogram_quantile(0.99, sum by(le,destination_service_name)(rate(istio_request_duration_milliseconds_bucket[1m])))  — per-leg p99;
      sum by(connection_security_policy)(rate(istio_requests_total[1m]))  — mTLS coverage.
      Targets: Prometheus UI > Status > Targets > podMonitor/istio-envoy-stats.
