---
# DFSP simulator deployment + mTLS Phase 1B (passthrough Ingress, mounted
# shared TLS Secret, OUTBOUND_MUTUAL_TLS_ENABLED + INBOUND_MUTUAL_TLS_ENABLED
# flips to true).

dfsp_chart: mojaloop/mojaloop-simulator
dfsp_release: dfsp
dfsp_version: "{{ chart_versions.mojaloop_simulator }}"

# Per-FSP values files location.
dfsp_values_dir: "{{ common_dir }}/dfsp"


# Liveness/readiness periodSeconds for scheme-adapter (defaults are
# too aggressive under high load).
dfsp_probe_period_seconds: 180

# scheme-adapter replica counts. fsp201/202 are high-traffic pairs (fsp201
# receives ~70% of callbacks at 500 TPS = ~1050/sec); fsp203-208 are standard.
# Override per-scenario in inventory.yaml or group_vars.
dfsp_sdk_replicas_high: 16  # fsp201, fsp202
dfsp_sdk_replicas_low:  4   # fsp203-208

# switch_lb_ip is provided by inventory.yaml (all.vars.switch_lb_ip), which
# terraform populates from the NLB ENI private IP. No default here — main.yml
# asserts it's set.

# DFSP cert + Phase 1B passthrough resources.
dfsp_tls_secret:        "{{ repo_root }}/certs/dfsp-tls-secret.yaml"
dfsp_passthrough_tmpl:  "{{ repo_root }}/manifests/mtls/dfsp-passthrough.yaml.j2"

# Note: scheme-adapter env/config overrides (mTLS flags, ENABLE_TEST_FEATURES)
# live in scenarios/<scenario>/overrides/dfsp.yaml — layered onto the helm
# install via per_fsp.yml's _fsp_override_arg. No post-install `kubectl set env`
# (was a source of Helm 4 SSA conflicts on re-runs). The scheme-adapter image is
# no longer pinned — the chart default carries the JWS fix the old pin worked around.
